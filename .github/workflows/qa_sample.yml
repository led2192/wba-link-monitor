name: QA sample

# Weekdays 04:31 UTC (06:31 Madrid): puts the day's ~15 review cases in Pipeline QA (Today's cases),
# after the nightly QA sync and before the daily Claude review pre-reads them.
on:
  schedule:
    - cron: "31 4 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints the batch; commit writes it"
        type: choice
        options: [dry-run, commit]
        default: dry-run

concurrency:
  group: qa-sample
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run qa_sample
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "commit" ]; then ARGS="--commit"; fi
          echo ">>> python qa_sample.py $ARGS"
          python qa_sample.py $ARGS
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
