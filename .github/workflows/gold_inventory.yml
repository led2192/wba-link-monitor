name: Gold inventory

# Which attributes have validated answers in the gold bases, and of what kind (number, percent, yes/no, text)
# (gold_inventory.py). Counts only. Read-only. Manual.
on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Count
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
        run: python gold_inventory.py
