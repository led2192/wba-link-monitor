# What a company is, read from its own reports (company_profile.py): headquarters, countries, subsidiaries, segments,
# sector, industry and sub-sector, each with its page.
# local: an open model on the job server, no cost, minutes a company; its Python environment is the models' own
#        (/srv/lantern/venv-llm).
# paid:  the reader's paid model, by hand only: seconds and about a tenth of a US cent a company; stops at max_usd.
# Dry run unless commit (or the clock). Prints counts, seconds and dollars only, never a company or a value.
name: Company profile

on:
  workflow_dispatch:
    inputs:
      model:
        description: "local (the job server, free) or paid (the reader's model, capped)"
        type: choice
        default: "local"
        options: [local, paid]
      max_usd:
        description: "the paid model stops at this cost"
        default: "3"
      commit:
        description: "write to the database (off: a dry run)"
        type: boolean
        default: false
      as_scheduled:
        description: "set by lantrNa's clock (server/clock.json): commit"
        default: "false"
      limit:
        description: "companies this run"
        default: "20"
      minutes:
        description: "stop cleanly after this many minutes"
        default: "50"
      threads:
        description: "processors the model may use (the server has 16)"
        default: "8"
      partition:
        description: "k/n: slice k of n"
        default: "0/1"

concurrency:
  group: company-profile-${{ inputs.model || 'local' }}-${{ inputs.partition || '0/1' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    if: ${{ inputs.model != 'paid' || inputs.as_scheduled == 'true' }}
    runs-on: [self-hosted, lantern]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - name: The models' own environment
        run: |
          [ -x /srv/lantern/venv-llm/bin/python ] || python3 -m venv /srv/lantern/venv-llm
          /srv/lantern/venv-llm/bin/pip install -q --upgrade pip
          /srv/lantern/venv-llm/bin/pip install -q "psycopg[binary]" huggingface_hub requests
          /srv/lantern/venv-llm/bin/pip install -q --only-binary=:all: llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Read
        run: |
          ARGS=(--limit "${{ inputs.limit || '20' }}" --minutes "${{ inputs.minutes || '50' }}" --threads "${{ inputs.threads || '8' }}" --partition "${{ inputs.partition || '0/1' }}")
          if [ "${{ inputs.as_scheduled }}" = "true" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS+=(--commit); fi
          /srv/lantern/venv-llm/bin/python company_profile.py "${ARGS[@]}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          HF_HOME: /srv/lantern/hf
  paid:
    if: ${{ inputs.model == 'paid' && inputs.as_scheduled != 'true' }}
    runs-on: [self-hosted, lantern]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Read
        run: |
          ARGS=(--model paid --limit "${{ inputs.limit || '20' }}" --minutes 280 --max-usd "${{ inputs.max_usd || '3' }}" --partition "${{ inputs.partition || '0/1' }}")
          if [ "${{ inputs.commit }}" = "true" ]; then ARGS+=(--commit); fi
          python company_profile.py "${ARGS[@]}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
