# What a company is, read from its own reports (company_profile.py): headquarters, countries, subsidiaries, segments,
# sector, industry and sub-sector, each with its page. An open model on the job server, no cost; its Python
# environment is the models' own (/srv/lantern/venv-llm). By hand, and by lantrNa's clock at night once the trial is
# read. Dry run unless commit (or the clock). Prints counts and seconds only, never a company or a value.
name: Company profile

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "write to the database (off: a dry run)"
        type: boolean
        default: false
      as_scheduled:
        description: "set by lantrNa's clock (server/clock.json): commit"
        default: "false"
      limit:
        description: "companies this run"
        default: "20"
      minutes:
        description: "stop cleanly after this many minutes"
        default: "50"
      threads:
        description: "processors the model may use (the server has 16)"
        default: "8"
      partition:
        description: "k/n: slice k of n"
        default: "0/1"

concurrency:
  group: company-profile-${{ inputs.partition || '0/1' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - name: The models' own environment
        run: |
          [ -x /srv/lantern/venv-llm/bin/python ] || python3 -m venv /srv/lantern/venv-llm
          /srv/lantern/venv-llm/bin/pip install -q --upgrade pip
          /srv/lantern/venv-llm/bin/pip install -q "psycopg[binary]" huggingface_hub requests
          /srv/lantern/venv-llm/bin/pip install -q --only-binary=:all: llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Read
        run: |
          ARGS=(--limit "${{ inputs.limit || '20' }}" --minutes "${{ inputs.minutes || '50' }}" --threads "${{ inputs.threads || '8' }}" --partition "${{ inputs.partition || '0/1' }}")
          if [ "${{ inputs.as_scheduled }}" = "true" ] || [ "${{ inputs.commit }}" = "true" ]; then ARGS+=(--commit); fi
          /srv/lantern/venv-llm/bin/python company_profile.py "${ARGS[@]}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          HF_HOME: /srv/lantern/hf
