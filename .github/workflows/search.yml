name: Active search (monthly)

# The monthly schedule is off (Oct 2026): it added up to 10 pages per company without review, which
# grew the base. Missing report pages are now PROPOSED nightly by discover_pages.py and added only
# on approval. Run this by hand only for a deliberate full sweep.
on:
  workflow_dispatch: {}

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python active_search.py
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_TABLE: monitored_links
