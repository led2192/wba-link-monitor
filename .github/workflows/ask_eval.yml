# Do the pages an answer reads still include the pages people confirmed? (ask_eval.py). Manual: run before and after
# a change to the search or to ask_pages. Calls no model. Prints counts only.
name: Ask evaluation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "keep the run's counts in public.ask_eval"
        type: boolean
        default: false
      limit:
        description: "questions at most"
        default: "300"
      option:
        description: "a search option to run off and then on (ask_doc_pages, ask_later, ask_latest, company_first, pairs); writes nothing"
        default: ""
      why:
        description: "count the causes of the questions whose confirmed page the search does not find"
        type: boolean
        default: false

concurrency:
  group: ask-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate
        run: python ask_eval.py --limit "$LIMIT" ${{ inputs.commit && '--commit' || '' }} ${{ inputs.why && '--why' || '' }} ${OPTION:+--option "$OPTION"}
        env:
          LIMIT: ${{ inputs.limit || '300' }}
          OPTION: ${{ inputs.option }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
