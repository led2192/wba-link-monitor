name: Re-run failed job once

# When a scheduled or chained job fails on its first attempt, run its failed jobs again once.
# Most failures are transient (Airtable or GitHub hiccups, a site timing out the whole job); every
# script is idempotent, so a re-run never duplicates. A re-run that succeeds also fires the next job
# in the chain. A second failure is left alone: base_health lists it and the weekly review reads it.
# Not covered: Scan now (runs every 30 minutes anyway), QA archive (deletes after archiving; a person
# should look), and runs that timed out (a re-run would hit the same budget).
on:
  workflow_run:
    workflows:
      - "Assign join ids (one-off / re-runnable)"
      - "Attach report PDFs"
      - "Base health"
      - "Build cover text"
      - "Build full text"
      - "Capture web pages (print to PDF)"
      - "Classify report library"
      - "Company coverage"
      - "Fix wrong attachments"
      - "Evidence passages"
      - "Evidence database load"
      - "File dates"
      - "Publication dates"
      - "Key reports"
      - "Dedupe report library"
      - "Suggest missing report pages"
      - "Document scope"
      - "Fiscal years"
      - "Harvest report PDFs"
      - "Key figures (revenue, employees)"
      - "Link and assign"
      - "Mention search"
      - "Monitor links (daily)"
      - "Browser monitor"
      - "QA sample"
      - "QA sync"
      - "Recover missing attachments"
      - "Regulator filings (annual reports)"
      - "Sustainability class"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
        run: |
          echo "Re-running failed jobs of '$NAME' (run $RUN_ID), first retry"
          sleep 120
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo "### Re-ran failed jobs of $NAME (run $RUN_ID) once" >> "$GITHUB_STEP_SUMMARY"
