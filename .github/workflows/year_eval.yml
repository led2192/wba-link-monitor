name: Year rules evaluation

# Scores the year rules of this checkout against the rules on main, on every document with a sure
# true year in Pipeline QA. Reads only. A pull request touching the year rules runs it and posts the
# comparison on the PR, so a rule change is merged only when it makes years more right.
on:
  workflow_dispatch:
  pull_request:
    paths: [fiscal_year.py, date_documents.py, fiscal_years.py, classify_library.py, source_type_terms.json, year_eval.py, .github/workflows/year_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rules on main, for comparison
        run: |
          git fetch -q origin main
          mkdir -p baseline
          git show origin/main:fiscal_year.py > baseline/fiscal_year.py
          git show origin/main:date_documents.py > baseline/date_documents.py
          git show origin/main:classify_library.py > baseline/classify_library.py
          git show origin/main:source_type_terms.json > baseline/source_type_terms.json
      - name: Evaluate
        run: python year_eval.py --baseline baseline
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          TEXT_STORE_REPO: ${{ vars.TEXT_STORE_REPO }}
          TEXT_STORE_TOKEN: ${{ secrets.TEXT_STORE_TOKEN }}
      - name: Post the comparison on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s year_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file year_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Year rules evaluation: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
