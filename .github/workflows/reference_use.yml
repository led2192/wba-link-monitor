# How much each norm and regulation of the reference list is named in the reports, by reporting year
# (reference_use.py): counted from the words of the pages, no model. Weekly, and by hand (dry, 40 entries, unless
# mode=commit). Prints counts only.
name: Reference use

on:
  workflow_dispatch:
    inputs:
      as_scheduled:
        description: "what the clock on the server starts: a commit run (server/clock.json)"
        type: boolean
        default: false
      mode:
        description: "dry_run or commit"
        default: "dry_run"
      by_day:
        description: "yes: a commit run may start in the hours people search (it loads the database)"
        default: "no"

concurrency:
  group: heavy-database      # one of the jobs that load the database at a time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ inputs.as_scheduled }}" = "true" ] || [ "${{ inputs.mode }}" = "commit" ]; then python reference_use.py --commit ${{ inputs.by_day == 'yes' && '--by-day' || '' }}
          else python reference_use.py --limit 40; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
