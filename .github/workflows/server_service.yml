# The service in front of the server's database of passages (server/service_install.sh, docs/server.md).
# Manual only, never on a pull request. "check" reads; "install" opens nothing; "open" lets the world reach the one
# route under the given name; "close" and "stop" are the ways back. Nothing secret is printed: this log is public.
name: Server service

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (reads only), install, open, close, stop; link (tell Supabase the address and the secret); probe (measure the way from Supabase)"
        type: choice
        options: [check, install, open, close, stop, link, probe, storm, pause, resume, restart-db]
        default: check
      host:
        description: "with open and link: the name that points to the server"
        default: ""
      times:
        description: "with probe and storm: how many calls or searches"
        default: "20"

concurrency:
  group: server-db
  cancel-in-progress: false

jobs:
  service:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The service
        if: inputs.mode != 'link' && inputs.mode != 'probe' && inputs.mode != 'storm'
        run: bash server/service_install.sh "$MODE" "$HOST_NAME"
        env:
          MODE: ${{ inputs.mode }}
          HOST_NAME: ${{ inputs.host }}
      # the secret goes from the server's file to Supabase's vault inside this one process: nothing of it is printed
      - name: Tell Supabase the address and the secret
        if: inputs.mode == 'link'
        run: sudo --preserve-env=SUPABASE_DB_URL /usr/bin/python3 server/meaning_link.py --link "$HOST_NAME"
        env:
          HOST_NAME: ${{ inputs.host }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Measure the way from Supabase
        if: inputs.mode == 'probe'
        run: /usr/bin/python3 server/meaning_link.py --probe "$TIMES"
        env:
          TIMES: ${{ inputs.times || '20' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Searches at once (a rehearsal; the option is on for these sessions only)
        if: inputs.mode == 'storm'
        run: /usr/bin/python3 server/meaning_link.py --storm "$TIMES"
        env:
          TIMES: ${{ inputs.times || '10' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
