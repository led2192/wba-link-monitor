name: Scan now

# On-demand scans: monitored_links rows with scan_now ticked, or new monitored pages (last 2 days)
# never read, go through the whole pipeline (scan_now.py).
#
# GitHub starts scheduled runs late (hours, in October 2026), so a short check every 10 minutes
# fired only a few times a day. Instead each run WATCHES for ~5.5 hours, checking Airtable every
# 3 minutes; the schedule tries every 30 minutes and, with the concurrency group below, at most
# one run is watching and one is queued behind it. Every Airtable call retries, and a failed pass
# is logged and retried at the next check instead of failing the run.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: "How long to keep watching (minutes). 0 = one pass."
        default: "330"

permissions:
  contents: write     # delete_now: the tombstone list is pushed before any row is deleted

concurrency:
  group: scan-now
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: Watch and scan
        run: python scan_now.py --watch "${{ inputs.watch_minutes || '330' }}" --every 180
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
