name: Scan now

# On-demand scans: monitored_links rows with scan_now ticked, or new monitored pages (last 2 days)
# never read, go through the whole pipeline (scan_now.py).
#
# GitHub starts scheduled runs late (hours, in October 2026), so a short check every 10 minutes
# fired only a few times a day. Instead each run WATCHES for ~5.5 hours, checking Airtable every
# 3 minutes; the schedule tries every 30 minutes and, with the concurrency group below, at most
# one run is watching and one is queued behind it. Every Airtable call retries, and a failed pass
# is logged and retried at the next check instead of failing the run.
#
# On 2 Nov 2026 the schedule still started nothing between 12:44 and 21:30 UTC, so the inbox left the
# web search's links waiting for hours (and web search waits when 20 companies hold research_link).
# So each watching run now starts the next one when it ends: the chain no longer depends on GitHub's
# scheduler, which stays as a fallback. To stop the chain, set the repository variable
# SCAN_CHAIN to "off" (Settings > Secrets and variables > Actions > Variables), or cancel the running watch.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: "How long to keep watching (minutes). 0 = one pass."
        default: "330"

permissions:
  contents: write     # delete_now: the tombstone list is pushed before any row is deleted
  actions: write      # a new mention search starts the Mention search workflow at once

concurrency:
  group: scan-now
  cancel-in-progress: false

jobs:
  scan:
    # On lanterN's own machine when the repository variable LANTERN_JOBS names this job, on GitHub's otherwise
    # (docs/server.md). Taking "scan_now" out of the variable is the way back, with no pull request.
    runs-on: ${{ fromJSON(contains(vars.LANTERN_JOBS, 'scan_now') && '["self-hosted","lantern"]' || '"ubuntu-latest"') }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright
      # The browser is a help for pages that need one, not a condition for the watch: on 11 Nov 2026 the system
      # packages it wants would not install (exit 100, then a hang of ten minutes) and the inbox stood still with
      # links waiting. Ten minutes at most, and the watch starts either way.
      - name: Browser for the pages that need one (the watch runs without it if this fails)
        run: timeout 600 playwright install --with-deps chromium || timeout 300 playwright install chromium || echo "no browser this run"
        continue-on-error: true
      - name: Where this runs
        run: echo "machine $RUNNER_NAME ($RUNNER_ENVIRONMENT), $(nproc) cores"
      - name: Watch and scan
        run: python scan_now.py --watch "${{ inputs.watch_minutes || '330' }}" --every 180
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          GITHUB_TOKEN: ${{ github.token }}
          # for the watch's side jobs (add_companies.py, browser_uploads.py): GitHub's schedule does not start them in time
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
      - name: Start the next watch
        if: ${{ !cancelled() && (inputs.watch_minutes || '330') != '0' && vars.SCAN_CHAIN != 'off' }}
        run: gh workflow run scan_now.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
