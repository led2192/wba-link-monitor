# Documents at an address of the Internet Archive that are not read: does the archive hold a better capture? (archive_recheck.py). By hand.
# One request a document to the archive's index, a dry run unless mode=commit, which adds a library row for each larger capture. Prints counts only.
name: Archive recheck

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"

concurrency:
  group: archive-recheck
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ inputs.mode }}" = "commit" ]; then python archive_recheck.py --commit; else python archive_recheck.py; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
