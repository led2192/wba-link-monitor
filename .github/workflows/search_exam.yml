# Does the search find the pages that print the figures analysts validated? (search_exam.py). Manual. Reads the gold
# bases (read-only token) and the evidence database; calls no model; writes nothing to the database. Prints attribute
# codes and counts only.
name: Search exam

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "validated answers an attribute (0 = all)"
        default: "25"
      attributes:
        description: "attribute codes, comma separated (empty = every number attribute of attributes.json)"
        default: ""
      option:
        description: "a search option to run off and then on (ask_later, ask_latest, ask_doc_pages, company_first, pairs, page_kinds, recent_meaning)"
        default: ""
      commit:
        description: "record the run's counters in Pipeline QA"
        type: boolean
        default: false

concurrency:
  group: search-exam
  cancel-in-progress: false

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Examine
        run: python search_exam.py --limit "$LIMIT" ${ATTRIBUTES:+--attributes "$ATTRIBUTES"} ${OPTION:+--option "$OPTION"} ${{ inputs.commit && '--commit' || '' }}
        env:
          LIMIT: ${{ inputs.limit || '25' }}
          ATTRIBUTES: ${{ inputs.attributes }}
          OPTION: ${{ inputs.option }}
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
