name: Fix wrong attachments

# Documents whose attached "PDF" is really a web page the site served instead of the file
# (fix_wrong_attachments.py): the wrong attachment is removed and the row goes to the office-network
# runner. Chained after Build cover text, which is what marks such files not_pdf; a pull request
# touching it runs a dry run and posts the counts.
on:
  workflow_run:
    workflows: ["Build cover text"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"
  pull_request:
    paths: [fix_wrong_attachments.py, .github/workflows/fix_wrong_attachments.yml]

concurrency:
  group: fix-wrong-attachments
  cancel-in-progress: false

jobs:
  fix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fix wrong attachments
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then ARGS="--commit"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then ARGS=""
          else ARGS=""; [ "${{ inputs.mode }}" = "commit" ] && ARGS="--commit"; fi
          python fix_wrong_attachments.py $ARGS
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s fix_wrong_attachments.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file fix_wrong_attachments.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Fix wrong attachments: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
