# lanterN's own permanent id for every company, written beside wba_id (phase 1 of running lanterN on its own).
# Fills empty `lantern_id` cells only; an id once written never changes. Manual, and after Add companies by hand.
name: lanterN ids

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "write the ids (false = print what would be written)"
        type: boolean
        default: false

concurrency:
  group: lantern-ids
  cancel-in-progress: false

jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ids
        run: python lantern_ids.py ${{ inputs.commit && '--commit' || '' }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
