name: Value evaluation

# Is the validated number anywhere in what we hold for the company? (value_eval.py) For the number
# attributes of gold_attributes.json, every validated 2025 answer's value is looked for in all the
# company's pages in the evidence database, printed in any scale. Read-only against the gold bases
# (GOLD_TOKEN) and the evidence database. Manual; a pull request touching it runs a sample of 50 answers
# per attribute and posts the table.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all validated answers with a value)"
        default: "0"
      attributes:
        description: "GMC codes, comma-separated (blank = all in gold_attributes.json)"
        default: ""
  pull_request:
    paths: [value_eval.py, gold_attributes.json, .github/workflows/value_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="--limit 50"
          else ARGS="--commit --limit ${{ inputs.limit }}"; [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"; fi
          python value_eval.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-eval
          path: value_eval.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s value_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file value_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Value evaluation: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
