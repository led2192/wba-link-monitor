name: Search check

# Read-only check of the evidence database's search functions (search_check.py): each sample search's
# companies, documents and pages found, and how long it takes. By hand only since 10 Nov 2026: run on every
# pull request that touched the search functions, its connection kept search_log busy for minutes and the
# functions-only install on the same branch failed on its lock timeout, twice.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = the sample searches; timing = where a lanterN search spends its time (search_timing.py); compare = an option beside the default (search_compare.py)"
        type: choice
        options: [check, timing, compare]
        default: check
      option:
        description: "compare: the option to try (a row of search_options)"
        default: pairs

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check search
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          QA_COMMIT: "true"
        run: |
          if [ "${{ inputs.mode }}" = "timing" ]; then python search_timing.py; elif [ "${{ inputs.mode }}" = "compare" ]; then python search_compare.py --option "${{ inputs.option || 'pairs' }}"; else python search_check.py; fi
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s search_check.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file search_check.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Search check: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
