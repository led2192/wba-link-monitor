# The passages and their index on the server's own database, and the comparison with Supabase (server_meaning.py,
# docs/server.md). Manual only. Supabase is only read. The role used on the server gets a password made for the run,
# never printed or stored, and cannot log in once the run ends.
name: Server meaning

on:
  workflow_dispatch:
    inputs:
      load:
        description: "copy the passages to the server and build their index (needs commit)"
        type: boolean
        default: false
      commit:
        description: "with load: do it (unticked: say what would be done)"
        type: boolean
        default: false
      sample:
        description: "with load: a block sample of this percent into the trial schema (0 = everything, the real schema)"
        default: "0"
      reload:
        description: "with load: empty the server's copy first"
        type: boolean
        default: false
      compare:
        description: "question vectors to ask both ways after the load (0 = none)"
        default: "0"
      trial:
        description: "compare against the trial schema"
        type: boolean
        default: false
      memory:
        description: "memory for the index build"
        default: "8GB"
      workers:
        description: "parallel workers for the index build"
        default: "6"

concurrency:
  group: server-db
  cancel-in-progress: false

jobs:
  meaning:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: The job's environment
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          /srv/lantern/venv/bin/pip install -q "psycopg[binary]" requests
      - name: Load and compare
        run: |
          PW=$(openssl rand -hex 24); echo "::add-mask::$PW"
          sudo -u postgres psql -d lantern -Atc "select 1 from pg_roles where rolname = 'lantern_load'" | grep -q 1 || sudo -u postgres createuser lantern_load
          printf "alter role lantern_load login password '%s';\n" "$PW" | sudo -u postgres psql -d lantern -q
          sudo -u postgres psql -d lantern -qc "grant create on database lantern to lantern_load"
          export LOCAL_DB_URL="postgresql://lantern_load:$PW@127.0.0.1:5432/lantern"
          /srv/lantern/venv/bin/python server_meaning.py ${{ inputs.load && '--load' || '' }} ${{ inputs.commit && '--commit' || '' }} ${{ inputs.reload && '--reload' || '' }} ${{ inputs.trial && '--trial' || '' }} \
            --sample "$SAMPLE" --compare "$COMPARE" --memory "$MEMORY" --workers "$WORKERS"
        env:
          SAMPLE: ${{ inputs.sample || '0' }}
          COMPARE: ${{ inputs.compare || '0' }}
          MEMORY: ${{ inputs.memory || '8GB' }}
          WORKERS: ${{ inputs.workers || '6' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: The role can no longer log in
        if: always()
        run: sudo -u postgres psql -d lantern -qc "alter role lantern_load nologin password null" && bash server/db_install.sh check
