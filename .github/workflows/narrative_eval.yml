name: Narrative evaluation

# Can the model answer a judgement attribute from the company's pages? (narrative_eval.py) The attributes
# with a "question" in gold_attributes.json, scored against the answers the Climate team validated at
# attribute level (ACT Core Climate; "No Evidence" counts as no). Read-only against the gold base and the
# evidence database; calls the model (ANTHROPIC_API_KEY), a few cents per 100 answers. Manual; a pull
# request touching it runs 15 answers per attribute and posts the table.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all validated answers, about 240 each)"
        default: "0"
      attributes:
        description: "GMC codes, comma-separated (blank = every attribute with a question)"
        default: ""
      max_usd:
        description: "stop at this estimated cost"
        default: "2"
      bases:
        description: "act (ACT Core Climate), monthly (the Metadata 2025 bases), or base ids"
        default: "act"
      tier:
        description: "reviewed (by WBA) or provider (QC Complete by the research provider, not reviewed)"
        type: choice
        options: [reviewed, provider]
        default: reviewed
      model:
        description: "reader model (default the reader's Haiku)"
        default: ""
      price:
        description: "the model's dollars per million tokens, input/output, for the cost limit (blank = Haiku's 0.10/0.50)"
        default: ""
      page_chars:
        description: "characters of each page shown to the model"
        default: "2500"
      pages:
        description: "what the model reads: pack3 (the evidence pack and one to three quotes, the default since 6 Nov 2026), or the pages of a page search: ts, bm25 or fused"
        default: pack3
      auto:
        description: "also read the N yes/no and list attributes with most answers in those bases (0 = only the hand-written ones)"
        default: "0"
  pull_request:
    paths: [narrative_eval.py, evidence_pack.py, .github/workflows/narrative_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_MODEL: ${{ inputs.model }}
          READER_PRICE: ${{ inputs.price }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="--limit 15 --max-usd 0.5 --evidence pack3"
          else P="${{ inputs.pages || 'pack3' }}"; EV=pages; [ "$P" = pack3 ] && { EV=pack3; P=ts; }; ARGS="--commit --disagreements --limit ${{ inputs.limit }} --max-usd ${{ inputs.max_usd }} --bases ${{ inputs.bases || 'act' }} --tier ${{ inputs.tier || 'reviewed' }} --auto ${{ inputs.auto || '0' }} --pages $P --page-chars ${{ inputs.page_chars || '2500' }} --evidence $EV"; [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"; fi
          python narrative_eval.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-eval
          path: narrative_eval.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s narrative_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file narrative_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Narrative evaluation: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
