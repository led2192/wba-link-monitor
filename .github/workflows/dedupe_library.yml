name: Dedupe report library

# Second line of defence against duplicate documents in report_library (the first is the doc_id
# guard inside harvest_reports.py). Runs after cover text is built, because the content signal
# needs page_count. It ticks discard with reason "Duplicate of another document" or, for SEC insider
# filings and call transcripts, "Not a disclosure"; it never
# deletes, and it never touches a verified row. The full list of what it discarded, with the row
# it kept, is uploaded as the dedupe_log artifact of each run.

on:
  workflow_run:
    workflows: ["Build cover text"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: "WRITE the discards. Leave OFF for a dry-run (plan only)."
        type: boolean
        default: false
      hash_signal:
        description: "Also treat rows with the same content_hash (identical file) as duplicates."
        type: boolean
        default: false

concurrency:
  group: dedupe-library
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Source Library import dry run (test branch only)
        run: python import_source_library.py --bases 2025,2024 --min-year 2023
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source_library_plan
          path: source_library_plan.csv
