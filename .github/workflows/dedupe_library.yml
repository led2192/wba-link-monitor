name: Dedupe report library

# Second line of defence against duplicate documents in report_library (the first is the doc_id
# guard inside harvest_reports.py). Runs after cover text is built, because the content signal
# needs page_count. It ticks discard with reason "Duplicate of another document" or, for SEC insider
# filings and call transcripts, "Not a disclosure"; it never
# deletes, and it never touches a verified row. The full list of what it discarded, with the row
# it kept, is uploaded as the dedupe_log artifact of each run.

on:
  workflow_run:
    workflows: ["Build cover text"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: "WRITE the discards. Leave OFF for a dry-run (plan only)."
        type: boolean
        default: false
      hash_signal:
        description: "Also treat rows with the same content_hash (identical file) as duplicates."
        type: boolean
        default: false

concurrency:
  group: dedupe-library
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Title, date and label documents from their file name and cover page
        # Rows whose address says nothing (…/media/download/3162) were left 'unresolved' by the URL
        # classifier. Now that the file and cover text exist, label them from those.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        run: python classify_library.py --from-file --commit --limit 20000
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_LIBRARY_TABLE: report_library
      - name: Type documents nothing else typed (non-English covers)
        # Rows with no address type and no AI type (mostly non-English: the AI types English only)
        # get a type from their file name and cover title, including cover-title phrases in other
        # languages (cover_terms.json). Measured by year_eval.py on the pull request.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.commit }}
        run: python classify_library.py --retype-untyped --commit --limit 40000
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_LIBRARY_TABLE: report_library
      - name: Document years from file name and cover page
        # Fixes doc_year where it came from an upload folder or a publication date, and records
        # the rule in doc_year_from. A slice per night; manual dry runs print a sample instead.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.commit }}" != "true" ]; then
            python date_documents.py --limit 4000
          else
            python date_documents.py --commit --limit 30000
          fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_LIBRARY_TABLE: report_library
      - name: Run dedupe
        run: |
          HASH=""
          [ "${{ inputs.hash_signal }}" = "true" ] && HASH="--hash-signal"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.commit }}" != "true" ]; then
            python dedupe_library.py $HASH
          else
            python dedupe_library.py --commit $HASH
          fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_LIBRARY_TABLE: report_library
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedupe_log
          path: dedupe_log.csv
          if-no-files-found: ignore
