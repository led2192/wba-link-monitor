# The unit of the values already proposed, put right once: value is the printed number times the scale, and the unit
# was the unit as printed (390,000 "Mt-CO2e" for 0.39 Mt-CO2e). Manual; dry run unless commit is ticked.
name: Fix units

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "write the units (false = print what would change)"
        type: boolean
        default: false

concurrency:
  group: fix-units
  cancel-in-progress: false

jobs:
  units:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Units
        run: python fix_units.py ${{ inputs.commit && '--commit' || '' }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
