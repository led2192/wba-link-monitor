name: Search page

# Publishes site/index.html (the evidence search page, sign-in by email) and site/search.html (the one-box
# search, opened from a link that carries its key; 10 Nov 2026) on GitHub Pages, with the Supabase project
# address and its publishable key filled in. The page holds no data: it signs people in with Supabase
# and calls the search functions, which allow WBA addresses and the addresses in search_access only.
# Also builds send-to-lantern.zip, the browser extension of extension/, with the same two values (11 Nov 2026).
# Needs: Settings > Pages > Source = GitHub Actions; repository variable SUPABASE_PUBLISHABLE_KEY.
on:
  push:
    branches: [main]
    paths: [site/**, extension/**, .github/workflows/search_page.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the project address and the publishable key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$KEY" || { echo "Set the repository variable SUPABASE_PUBLISHABLE_KEY first"; exit 1; }
          mkdir -p public
          for f in index.html search.html bot.html send-to-lantern.html; do
            sed -e "s#__SUPABASE_URL__#${SUPABASE_URL%/}#" -e "s#__SUPABASE_PUBLISHABLE_KEY__#${KEY}#" site/$f > public/$f
            grep -q "__SUPABASE_" public/$f && { echo "placeholders left in $f"; exit 1; } || true
          done
      - name: Build the browser extension (Send to lanterN) with the same two values
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p build/send-to-lantern && cp extension/* build/send-to-lantern/
          sed -i -e "s#__SUPABASE_URL__#${SUPABASE_URL%/}#" -e "s#__SUPABASE_PUBLISHABLE_KEY__#${KEY}#" build/send-to-lantern/config.js
          grep -q "__SUPABASE_" build/send-to-lantern/config.js && { echo "placeholders left in the extension"; exit 1; } || true
          (cd build && zip -qr ../public/send-to-lantern.zip send-to-lantern)
          # the download link carries the version: a browser that kept the last zip served 0.4.2 after 0.4.3 was out (13 Nov 2026)
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          sed -i -e "s#href=\"send-to-lantern.zip\">Download the extension (zip)#href=\"send-to-lantern.zip?v=$V\">Download the extension, version $V (zip)#" public/send-to-lantern.html
          grep -q "send-to-lantern.zip?v=$V" public/send-to-lantern.html || { echo "the download link was not given its version"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
