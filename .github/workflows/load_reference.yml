# The reference list (terms, norms, regulations, organisations) from the private store into the search database
# (load_reference.py), for lantrNa's reference card. By hand when the list changes, and weekly so that a change
# made in the store is never left unloaded. Manual runs are dry unless mode=commit. Nothing of the list is printed.
name: Reference list

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"

concurrency:
  group: load-reference
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "commit" ]; then python load_reference.py --commit
          else python load_reference.py; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TEXT_STORE_REPO: ${{ vars.TEXT_STORE_REPO }}
          TEXT_STORE_TOKEN: ${{ secrets.TEXT_STORE_TOKEN }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
