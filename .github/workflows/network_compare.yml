# Do company sites answer lanterN's own machine as they answer GitHub's? The same sample of monitored pages is
# read from both with the monitor's own request (network_compare.py) and compared page by page. Read-only, counts
# only. Manual: run it before a job that reads company sites moves to the server (docs/server.md).
name: Network compare

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "pages to read from each machine"
        default: "400"

jobs:
  github:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      outcomes: ${{ steps.read.outputs.outcomes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: read
        run: python network_compare.py --read --sample "${{ inputs.sample }}"
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
  server:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 60
    outputs:
      outcomes: ${{ steps.read.outputs.outcomes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - id: read
        run: python network_compare.py --read --sample "${{ inputs.sample }}"
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
  compare:
    needs: [github, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Machine A is GitHub's, machine B is the server
        run: python network_compare.py --compare "A=${{ needs.github.outputs.outcomes }}" "B=${{ needs.server.outputs.outcomes }}"
