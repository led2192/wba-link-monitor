# A look at lanterN's own job machine (docs/server.md), run on it: its size, its protections, whether the first-boot
# token is gone, and whether a job can do there what jobs do on GitHub's machines (Python from setup-python, the
# repository's packages). Reads only. Manual, and every Monday before the week's work.
name: Server check

on:
  workflow_dispatch:
    inputs:
      prepare:
        description: "also install the system packages the page reader's browser needs (once, or after a reinstall)"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * 1"        # Mondays 05:23 UTC

jobs:
  check:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The machine
        run: |
          echo "runner: $RUNNER_NAME   system: $(. /etc/os-release; echo "$PRETTY_NAME")   kernel: $(uname -r)"
          echo "cores: $(nproc)   memory: $(free -g | awk '/^Mem/{print $2}') GB   disk free: $(df -h / | awk 'NR==2{print $4}') of $(df -h / | awk 'NR==2{print $2}')"
          echo "up since: $(uptime -s)   load: $(cut -d' ' -f1-3 /proc/loadavg)"
          echo "runner services running: $(systemctl list-units 'actions.runner.*' --state=running --no-legend | wc -l)"
      - name: Peek
        run: |
          pid=$(pgrep -f "scan_now.py --watch" | head -1); echo "PID $pid started $(ps -o lstart= -p $pid) cpu $(ps -o time= -p $pid)"
          pgrep -af "python" | cut -c1-150
          sudo ss -tnp 2>/dev/null | grep "pid=$pid," | awk '{print $1,$4,$5}' | head
          pip install -q py-spy && sudo env "PATH=$PATH" py-spy dump --pid $pid | cut -c1-200 | head -60
          echo "TAIL"; f=$(sudo sh -c 'ls -t /home/runner/actions-runner-4/_diag/pages/*.log' | head -1); sudo tail -n 12 "$f" | cut -c1-200
