# A look at lanterN's own job machine (docs/server.md), run on it: its size, its protections, whether the first-boot
# token is gone, and whether a job can do there what jobs do on GitHub's machines (Python from setup-python, the
# repository's packages). Reads only. Manual, and every Monday before the week's work.
name: Server check

on:
  workflow_dispatch:
    inputs:
      prepare:
        description: "also install the system packages the page reader's browser needs (once, or after a reinstall)"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * 1"        # Mondays 05:23 UTC

jobs:
  check:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 20
    steps:
      - name: Peek (reads only)
        env:
          HF_HOME: /srv/lantern/hf
        run: |
          echo "compilers: gcc $(command -v gcc >/dev/null && gcc -dumpversion || echo no), g++ $(command -v g++ >/dev/null && echo yes || echo no), cmake $(command -v cmake >/dev/null && cmake --version | head -1 | awk '{print $3}' || echo no), make $(command -v make >/dev/null && echo yes || echo no)"
          echo "python: $(/srv/lantern/venv/bin/python --version)   cpu flags: $(grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|fma|f16c|avx512f)$' | tr '\n' ' ')"
          echo "disk free: $(df -h / | awk 'NR==2{print $4}')"
          mkdir -p /tmp/wheelprobe && cd /tmp/wheelprobe
          /srv/lantern/venv/bin/pip download --no-deps --only-binary=:all: -d . llama-cpp-python 2>&1 | tail -2 || true
          /srv/lantern/venv/bin/pip download --no-deps --only-binary=:all: -d . llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu 2>&1 | tail -2 || true
          ls -la /tmp/wheelprobe | tail -3; rm -rf /tmp/wheelprobe
          /srv/lantern/venv/bin/python - <<'PY'
          from huggingface_hub import list_repo_files, model_info
          for repo in ("Qwen/Qwen3.5-4B-GGUF", "Qwen/Qwen3.5-4B", "unsloth/Qwen3.5-4B-GGUF", "bartowski/Qwen_Qwen3.5-4B-GGUF", "microsoft/Phi-4-mini-instruct-gguf", "unsloth/Phi-4-mini-instruct-GGUF", "bartowski/microsoft_Phi-4-mini-instruct-GGUF",
                       "Qwen/Qwen2.5-7B-Instruct-GGUF", "Qwen/Qwen3-4B-GGUF", "Qwen/Qwen3-8B-GGUF", "Qwen/Qwen3-1.7B-GGUF", "HuggingFaceTB/SmolLM3-3B-GGUF", "ggml-org/SmolLM3-3B-GGUF", "google/gemma-3-4b-it-qat-q4_0-gguf"):
              try:
                  files = [f for f in list_repo_files(repo) if f.lower().endswith(".gguf")]
                  try: lic = (model_info(repo).card_data or {}).get("license")
                  except Exception: lic = "?"
                  q4 = [f for f in files if "q4_k_m" in f.lower()]
                  print(f"{repo}: {len(files)} gguf, licence {lic}, q4_k_m: {q4[:2]}")
              except Exception as e:
                  print(f"{repo}: not found ({type(e).__name__})")
          PY
