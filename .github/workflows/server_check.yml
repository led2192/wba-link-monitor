name: Server check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, lantern]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Probe
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import evidence_db
          with evidence_db.connect() as conn:
              cur = conn.cursor()
              cur.execute("""
                with d as (select type_ours t, nullif(fields->>'page_count','')::float p, wba_id, coalesce(fields->>'verified','') v
                           from public.library where gone is null and not discard)
                select t, count(*) n, count(*) filter (where p = 1) p1, count(*) filter (where p = 2) p2, count(*) filter (where p between 3 and 5) p3_5,
                       count(*) filter (where p between 6 and 10) p6_10, count(*) filter (where p is null) nop,
                       count(*) filter (where p <= 2 and v = 'true') short_verified
                from d group by 1 order by 2 desc limit 30""")
              print("TYPE | docs | 1p | 2p | 3-5p | 6-10p | no count | <=2p verified")
              for r in cur.fetchall(): print("ROW", " | ".join(str(x) for x in r))
              cur.execute("""select count(*), count(distinct wba_id) from public.library where gone is null and not discard
                             and type_ours in ('Annual Report','Integrated Report','10K','Registration Document','Sustainability Report','ESG Report','CSR Report','Impact Report')
                             and nullif(fields->>'page_count','')::float <= 2""")
              print("KEY", cur.fetchone())
              cur.execute("""select type_ours, fields->>'page_count', fields->>'source_type', fields->>'page_type', count(*) from public.library
                             where gone is null and wba_id = 'PT_02151' and nullif(fields->>'page_count','')::float <= 2 group by 1,2,3,4 order by 5 desc limit 12""")
              for r in cur.fetchall(): print("STELL", r)
          PY
