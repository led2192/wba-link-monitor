name: Propose values

# Proposed attribute values in the Disclosure Library table attribute_values (propose_values.py): revenue
# from SEC and ESEF XBRL filings for every company with the identifier, and (method model) every number
# attribute read by the model reader from the company's reports, compared with the validated 2025
# answers. Writes only with commit ticked; never touches a row a person accepted or rejected. A pull
# request touching it runs a dry run: 30 companies per filing method, and the model reader on three
# companies with no filing (at most 0.30 USD). Nightly since 9 Nov 2026 (05:07 UTC): the filings for every
# company and the model reader, incremental, on the pilot attributes with a 1.5 USD cap.
on:
  workflow_run:                # the nightly pass runs after the night's Evidence database load (01:41 UTC cron, about
    workflows: ["Evidence database load"]   # 02:20 in practice): GitHub fired the 05:07 cron hours late or not at all
    types: [completed]         # (10 Nov 2026); the load's evening run (19:41 UTC) is skipped by the hour check below
  schedule:
    - cron: "7 5 * * *"        # 05:07 UTC fallback (owner's decision, 9 Nov 2026): SEC and ESEF for every company, then the
                               # model reader on the pilot attributes for 2024 and 2025, what was not read in 30 days,
                               # up to 1.5 USD; a refused call (no credit) stops the reading and writes what was read.
                               # Idempotent: a second pass in a day re-reads nothing within --fresh-days
  workflow_dispatch:
    inputs:
      commit:
        description: "write to attribute_values (unticked = dry run)"
        type: boolean
        default: false
      years:
        description: "WBA years: 2018- (2018 to last year), 2024, or 2022,2023"
        default: "2018-"
      methods:
        description: "sec, esef, model (the model reader, billed to the Anthropic credit), comma-separated"
        default: "sec,esef"
      model_years:
        description: "model reader: years to read"
        default: "2024"
      attributes:
        description: "model reader: GMC codes (blank = every number attribute)"
        default: ""
      companies:
        description: "model reader: wba ids, comma-separated (blank = every company, up to limit)"
        default: ""
      max_usd:
        description: "model reader: stop at this estimated cost (per parallel job)"
        default: "1"
      limit:
        description: "companies per method (0 = all)"
        default: "0"
      fresh_days:
        description: "model reader: skip what was read in the last N days, so a run goes on where the last stopped (0 = read again)"
        default: "30"
      shards:
        description: "parallel jobs, each taking a fixed slice of the companies (1 to 8). Each job reads for up to five hours and has its own cost limit."
        default: "1"
      fill_links:
        description: "only give existing model-reader rows their evidence_link (no reading, no cost), with commit ticked to write"
        type: boolean
        default: false
      fy_months:
        description: "model reader: only companies whose fiscal year ends in these months, e.g. 1-6 (blank = all); with fresh_days 0 for the re-read after the fiscal-year fix"
        default: ""
  pull_request:
    paths: [propose_values.py, extract_eval.py, model_reader.py, .github/workflows/propose_values.yml]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        run: |
          N="${{ inputs.shards || '1' }}"; [ "$N" -ge 1 ] 2>/dev/null || N=1; [ "$N" -le 8 ] || N=8
          echo "shards=$(python3 -c "import json;print(json.dumps([f'{i}/$N' for i in range(1, $N + 1)]))")" >> "$GITHUB_OUTPUT"
  propose:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345           # GitHub's limit is 360; the script stops reading at 300 (--budget) and writes
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                      # wheels kept between runs (torch and sentence-transformers took 3 to 5 minutes a run, 9 Nov 2026)
          cache-dependency-path: |
            requirements.txt
            .github/workflows/*.yml
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Propose
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="--limit 30 --methods sec,esef,model --companies PT_02083,PT_00646,PT_02801 --model-years 2024 --max-usd 0.3 --escalate none"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              H=$(date -u -d "${{ github.event.workflow_run.run_started_at }}" +%H)
              # (11 Nov 2026: a functions-only install of the search functions, dispatched by hand at 06:33 UTC, is also a
              # load that "completed" before noon, and it started a second paid pass beside the night's. Only the
              # scheduled load starts one.)
              if [ "${{ github.event.workflow_run.conclusion }}" != "success" ] || [ "$H" -ge 12 ] || [ "${{ github.event.workflow_run.event }}" != "schedule" ]; then
                echo "the load that finished was not the night's scheduled one (event ${{ github.event.workflow_run.event }}, started ${{ github.event.workflow_run.run_started_at }}, ${{ github.event.workflow_run.conclusion }}): nothing to do"; exit 0
              fi
            fi
            ARGS="--years 2018- --methods sec,esef,model --model-years 2025,2024 --attributes GMC_00048.1,GMC_00001.1,GMC_00002.1,GMC_00003.1,GMC_02526.1 --max-usd 5 --fresh-days 30 --commit"
          else
            ARGS="--years ${{ inputs.years }} --methods ${{ inputs.methods }} --limit ${{ inputs.limit }} --model-years ${{ inputs.model_years }} --max-usd ${{ inputs.max_usd }} --fresh-days ${{ inputs.fresh_days || '30' }}"
            [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"
            [ -n "${{ inputs.companies }}" ] && ARGS="$ARGS --companies ${{ inputs.companies }}"
            [ -n "${{ inputs.fy_months }}" ] && ARGS="$ARGS --fy-months ${{ inputs.fy_months }}"
            [ "${{ inputs.commit }}" = "true" ] && ARGS="$ARGS --commit"
            [ "${{ inputs.fill_links }}" = "true" ] && ARGS="$ARGS --fill-links"
            if [ "${{ matrix.shard }}" != "1/1" ]; then
              ARGS="$ARGS --shard ${{ matrix.shard }}"
              export QA_RUN_PART="shard$(echo '${{ matrix.shard }}' | tr / -)"   # one Pipeline QA row per shard, not one overwritten by each
            fi
          fi
          python propose_values.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propose-values-${{ strategy.job-index }}
          path: propose_values.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s propose_values.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file propose_values.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Propose values: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
