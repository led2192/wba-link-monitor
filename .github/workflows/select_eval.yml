name: Page choice experiment

# Which way of choosing the model reader's 8 pages puts the validated number in front of it (select_eval.py):
# today's choice next to query expansion, a learned document-type prior, a learned ranker, meaning
# (embeddings), translated words for documents not in English, and a model locate pass, on the same
# answers. Read-only. Manual; a pull request touching it runs a small sample of the methods that need no
# model and no download.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all)"
        default: "150"
      methods:
        description: "comma-separated: base,expand,doctype,learned,embed,translate,locate"
        default: "base,expand,doctype,learned,embed,translate,locate"
      locate_usd:
        description: "cost limit of the model calls (translate, locate)"
        default: "2"
      budget:
        description: "minutes for reading the answers' pages"
        default: "70"
  pull_request:
    paths: [select_eval.py, .github/workflows/select_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install the embedding model's library (CPU)
        if: github.event_name == 'workflow_dispatch' && contains(inputs.methods, 'embed') || github.event_name == 'workflow_dispatch' && contains(inputs.methods, 'learned')
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_MODEL: claude-haiku-5-5
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python select_eval.py --limit 8 --methods base,expand,doctype,learned --budget 15
          else
            python select_eval.py --limit ${{ inputs.limit }} --methods ${{ inputs.methods }} --locate-usd ${{ inputs.locate_usd }} --budget ${{ inputs.budget }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: select-eval
          path: select_eval.md
          if-no-files-found: ignore
      - name: Post the summary on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s select_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file select_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Page choice experiment: no result (see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
