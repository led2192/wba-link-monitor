name: Evidence pack experiment

# Would a pack of short passages chosen without a model put the evidence in front of the reader more often
# than today's pages (pack_eval.py)? Narrative attributes: the analyst's evidence text; number attributes: the
# validated number. Same answers, no model calls. Read-only. Manual; a pull request touching it runs a sample.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all)"
        default: "120"
      kinds:
        description: "narrative,number"
        default: "narrative,number"
      pack:
        description: "passages in the pack"
        default: "15"
      budget:
        description: "minutes"
        default: "80"
      read:
        description: "narrative only: the model reads today's pages, the pack with one quote and the pack with up to 3 quotes (billed)"
        type: boolean
        default: false
      max_usd:
        description: "cost limit of the model calls (with read)"
        default: "3"
      save:
        description: "narrative: write the pack's learned words (pack_terms.json, also printed to the log) for narrative_eval --evidence pack3"
        type: boolean
        default: false
  pull_request:
    paths: [pack_eval.py, .github/workflows/pack_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 200          # with read: about 60 minutes of page search and 1,000 model calls (6 Nov 2026)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_MODEL: claude-haiku-5-5
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then python pack_eval.py --limit 10 --budget 15
          else python pack_eval.py --limit ${{ inputs.limit }} --kinds ${{ inputs.kinds }} --pack ${{ inputs.pack }} --budget ${{ inputs.budget }} ${{ inputs.read && format('--read --max-usd {0}', inputs.max_usd) || '' }} ${{ inputs.save && '--save pack_terms.json' || '' }}; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-eval
          path: pack_eval.md
          if-no-files-found: ignore
      - name: Post the summary on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s pack_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file pack_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Evidence pack experiment: no result (see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
