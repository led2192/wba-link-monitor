name: Vocabulary mining

# The words that set apart the page where an attribute's value is printed (vocab_mining.py): learned from
# the validated 2025 answers (the Generic reader's scored sample held out), weighted against other pages of
# the same reports. Prints vocabulary.json for the reader's retrieval. Read-only against the gold bases
# and the evidence database. Manual; a pull request touching it runs 300 answers per attribute.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute to learn from"
        default: "300"
      attributes:
        description: "GMC codes, comma-separated (blank = all in gold_attributes.json)"
        default: ""
  pull_request:
    paths: [vocab_mining.py, .github/workflows/vocab_mining.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="--limit 300"
          else ARGS="--commit --limit ${{ inputs.limit }}"; [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"; fi
          python vocab_mining.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocab-mining
          path: vocab_mining.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s vocab_mining.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file vocab_mining.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Vocabulary mining: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
