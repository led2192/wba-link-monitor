name: Element evaluation

# What the analysts cited in 2025 for each element of the Social and non-Social benchmarks (verified at
# element level), and how much of it the library holds (element_eval.py). Read-only against the Indicators
# bases (GOLD_TOKEN), the Disclosure Library and the evidence database. Manual; a pull request touching it
# runs with a sample of 300 rows for the library stage and posts the tables.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "element rows checked against the library and the evidence database"
        default: "1500"
  pull_request:
    paths: [element_eval.py, .github/workflows/element_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="--sample 300"
          else ARGS="--commit --sample ${{ inputs.sample }}"; fi
          python element_eval.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-eval
          path: element_eval.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s element_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file element_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Element evaluation: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
