name: Vault secret

# Manual. Copies the repository secret HF_TOKEN into the database's vault as hf_token (vault_secret.py), where
# query_vector reads it, and with commit = true asks for three vectors to see that it works. Prints no secret.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "true to store the secret (dry run otherwise)"
        default: "false"

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ inputs.commit }}" = "true" ]; then python vault_secret.py --name hf_token --env HF_TOKEN --commit --try-query; else python vault_secret.py --name hf_token --env HF_TOKEN; fi
