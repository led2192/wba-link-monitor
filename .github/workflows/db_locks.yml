name: Database locks

# Lists the evidence database's active sessions and the locks they wait for; with release = true ends the
# schema statements (alter table, create table, create index) stuck waiting for a lock, which otherwise block
# every new reader of the table (db_locks.py, 9 Nov 2026). Manual only.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "true to end the waiting schema statements (dry run otherwise, which only lists)"
        default: "false"
      orphans:
        description: "true to end the statements that outlived their job (older than 6 h 30 min)"
        default: "false"

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then python db_locks.py --release --commit; else python db_locks.py --release; fi
          if [ "${{ inputs.orphans }}" = "true" ]; then python db_locks.py --orphans --commit; else python db_locks.py --orphans; fi
