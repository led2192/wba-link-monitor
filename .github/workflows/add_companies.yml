# Companies that are not in WBA's list become companies of lanterN (add_companies.py): rows added by hand to
# the companies table with no id, and requests from the page once a person has approved them. Each gets
# lanterN's own id, and its website is searched for the report pages at once (discover_pages.py).
# Hourly, and by hand. Dry run on a pull request.
name: Add companies

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "commit"
  pull_request:
    paths: [add_companies.py, .github/workflows/add_companies.yml]

concurrency:
  group: add-companies
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Give ids, copy requests, add the approved ones
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.mode }}" = "dry_run" ]; then python add_companies.py --ids-file new_ids.txt
          else python add_companies.py --commit --ids-file new_ids.txt; fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
      - name: Search the new companies' websites for their report pages
        if: github.event_name != 'pull_request' && inputs.mode != 'dry_run'
        run: |
          IDS="$(cat new_ids.txt 2>/dev/null || true)"
          if [ -z "$IDS" ]; then echo "no new company this hour"; exit 0; fi
          python discover_pages.py --commit --max 200 --wba "$IDS"
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_TABLE: monitored_links
