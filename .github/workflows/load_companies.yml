# The company profiles (industry, country, region) from Airtable into the evidence database, for Lantern's
# filters (load_companies.py). Nightly after the Evidence database load, and by hand. Dry run on a PR.
name: Company profiles

on:
  workflow_run:
    workflows: ["Evidence database load"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "commit"

concurrency:
  group: load-companies
  cancel-in-progress: false

jobs:
  load:
    runs-on: [self-hosted, lantern]      # on lantrNa's server since the move of 22 Nov 2026 (GitHub's machines before)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.mode }}" = "dry_run" ]; then python load_companies.py
          else python load_companies.py --commit; fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
