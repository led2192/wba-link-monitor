# Option reader_plain_words beside today's answers (ask_wording_compare.py). Manual only. CALLS THE PAID READER: three
# calls a question, about 0.6 US cents a question; the owner allowed it on 20 Nov 2026, up to about 0.6 USD. Keeps nothing in the
# database. Prints counts only.
name: Ask wording comparison

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "questions at most (three reader calls each)"
        default: "60"

concurrency:
  group: ask-wording-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare
        run: python ask_wording_compare.py --limit "${{ inputs.limit || '60' }}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          QA_COMMIT: "true"
