# The PDF of each document to be archived, copied to lanterN's own storage (the private bucket "archive") before
# anything is deleted (archive_copy.py). Manual: a dry run counts what is left to copy; commit copies up to the
# limit and the minutes given, and can be run again until nothing is left. Needs the secret SUPABASE_SERVICE_KEY.
name: Archive copy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run (count only) or commit (copy)"
        type: choice
        options: [dry_run, commit]
        default: dry_run
      rule:
        description: "A = 2021 or earlier, B = 2021 or earlier and not a key type, all = every document with a file (runs on lanterN's machine and keeps a copy on its disk too)"
        type: choice
        options: [B, A, all]
        default: B
      workers:
        description: "files copied at the same time"
        default: "1"
      limit:
        description: "documents this run (0 = all that fit in the minutes)"
        default: "0"
      minutes:
        description: "stop starting new batches after this many minutes"
        default: "300"

concurrency:
  group: archive-copy
  cancel-in-progress: false

jobs:
  copy:
    # "all" is lanterN's own copy of every document: on its machine, with the working copy on its disk, and with
    # no six-hour limit (a run may last a day; it can be started again and goes on where it stopped)
    runs-on: ${{ fromJSON(inputs.rule == 'all' && '["self-hosted","lantern"]' || '"ubuntu-latest"') }}
    timeout-minutes: ${{ inputs.rule == 'all' && 1430 || 345 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Copy
        run: |
          DISK=""
          if [ "${{ inputs.rule }}" = "all" ]; then DISK=/srv/lantern/files; sudo mkdir -p "$DISK"; sudo chown "$(id -un)":"$(id -gn)" /srv/lantern "$DISK"; echo "disk free: $(df -h "$DISK" | awk 'NR==2{print $4}')"; fi
          if [ "${{ inputs.mode }}" != "commit" ]; then python archive_copy.py --rule "${{ inputs.rule || 'B' }}" --disk "$DISK"
          else python archive_copy.py --commit --rule "${{ inputs.rule }}" --limit "${{ inputs.limit }}" --minutes "${{ inputs.minutes }}" --workers "${{ inputs.workers || '1' }}" --disk "$DISK"; fi
          if [ -n "$DISK" ]; then echo "on the disk: $(find "$DISK" -name '*.pdf' | wc -l) files, $(du -sh "$DISK" | cut -f1); free $(df -h "$DISK" | awk 'NR==2{print $4}')"; fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
