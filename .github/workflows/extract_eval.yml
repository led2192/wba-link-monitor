name: Generic reader

# The generic reader of number attributes (extract_eval.py), driven by attributes.json, scored stage by
# stage against the validated 2025 answers: documents, pages, reading, right value. The last step is read
# by rules or, with reader "model", by a language model (model_reader.py, ANTHROPIC_API_KEY or GEMINI_API_KEY, READER_MODEL).
# Read-only against the gold bases (GOLD_TOKEN) and the evidence database. Manual; a pull request touching
# it runs 40 answers per attribute with both readers and posts both tables (the model run costs cents).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all validated answers with a value)"
        default: "0"
      attributes:
        description: "GMC codes, comma-separated (blank = all in gold_attributes.json)"
        default: ""
      reader:
        description: "who reads the chosen pages: rules (free) or model (Anthropic API, billed)"
        type: choice
        options: [rules, model]
        default: rules
      text_rank:
        description: "text score of the page ranking: ts (ts_rank_cd, today) or bm25"
        type: choice
        options: [ts, bm25]
        default: ts
      model:
        description: "model for the model reader: a Claude model name, or a Gemini one (gemini-...; GEMINI_API_KEY)"
        default: "claude-haiku-5-5"
      price:
        description: "the model's price as in/out dollars per million tokens (blank = Haiku's list price in the cost line)"
        default: ""
      guidance:
        description: "today, or learned: the analysts' choice rules (decision_rules.json) in the prompt and as a check"
        type: choice
        options: [today, learned, check, md]
        default: today
      budget:
        description: "minutes for reading answers (the job stops at 180)"
        default: "100"
      page_text:
        description: "the text the model reads: db (today), or each page re-read from the PDF with its tables: pymupdf or docling"
        type: choice
        options: [db, pymupdf, docling]
        default: db
      select:
        description: "how the model's pages are chosen: base (today), learned (page_select.py), oracle (diagnostic: the pages printing the figure first), map, map-half, navigate or navigate-half (the document map, doc_map.py), rerank (a cross-encoder trained on the analysts' validated pages, rerank_train.py)"
        type: choice
        options: [base, learned, oracle, map, map-half, navigate, navigate-half, rerank]
        default: base
      options:
        description: "more extract_eval options, e.g. --order reversed (position bias) or --unstated-basis keep (Scope 2 with no basis stated filed under market too) or --heldout 20 (20 held-out number attributes, heldout.py)"
        default: ""
  pull_request:
    paths: [extract_eval.py, model_reader.py, heldout.py, doc_map.py, decision_rules.json, page_select.py, table_text.py, attributes.json, .github/workflows/extract_eval.yml]

concurrency:                      # a newer commit of the same pull request replaces the older run (1 Nov 2026: two pushes
                                  # 4 s apart ran two 2-hour scorings that slowed each other past the limit). Manual runs
                                  # get a group of their own: on 4 Nov 2026 a bm25 run started from main cancelled the ts run.
  group: extract-eval-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                      # wheels kept between runs (torch and sentence-transformers took 3 to 5 minutes a run, 9 Nov 2026)
          cache-dependency-path: |
            requirements.txt
            .github/workflows/*.yml
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v1
      - name: Install the embedding model's library (CPU), for the learned page choice
        if: github.event_name == 'workflow_dispatch' && (inputs.select == 'learned' || inputs.select == 'rerank' || startsWith(inputs.select, 'map'))
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentence-transformers datasets
      - name: Install the table parser, for pages re-read with their tables
        if: github.event_name == 'workflow_dispatch' && inputs.page_text != 'db' && inputs.page_text != ''
        run: |
          if [ "${{ inputs.page_text }}" = docling ]; then pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu; pip install docling; else pip install pymupdf4llm; fi
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
          READER_PRICE: ${{ inputs.price }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python extract_eval.py --limit 40 --reader rules; mv extract_eval.md rules.md
            python extract_eval.py --limit 40 --reader model || true
            cat rules.md extract_eval.md > both.md && mv both.md extract_eval.md
          else
            ARGS="--commit --limit ${{ inputs.limit }} --reader ${{ inputs.reader }} --text-rank ${{ inputs.text_rank || 'ts' }} --select ${{ inputs.select || 'base' }} ${{ inputs.options }} --page-text ${{ inputs.page_text || 'db' }} --guidance ${{ inputs.guidance || 'today' }} --budget ${{ inputs.budget || '100' }}"
            [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"
            python extract_eval.py $ARGS
          fi
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-eval
          path: extract_eval.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s extract_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file extract_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Generic reader: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
