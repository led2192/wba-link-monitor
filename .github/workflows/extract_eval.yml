name: Generic reader

# The generic reader of number attributes (extract_eval.py), driven by attributes.json, scored stage by
# stage against the validated 2025 answers: documents, pages, reading, right value. The last step is read
# by rules or, with reader "model", by a language model (model_reader.py, ANTHROPIC_API_KEY, READER_MODEL).
# Read-only against the gold bases (GOLD_TOKEN) and the evidence database. Manual; a pull request touching
# it runs 40 answers per attribute with both readers and posts both tables (the model run costs cents).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers per attribute (0 = all validated answers with a value)"
        default: "0"
      attributes:
        description: "GMC codes, comma-separated (blank = all in gold_attributes.json)"
        default: ""
      reader:
        description: "who reads the chosen pages: rules (free) or model (Anthropic API, billed)"
        type: choice
        options: [rules, model]
        default: rules
      model:
        description: "model for the model reader"
        default: "claude-haiku-5-5"
  pull_request:
    paths: [extract_eval.py, model_reader.py, attributes.json, .github/workflows/extract_eval.yml]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          READER_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python extract_eval.py --limit 40 --reader rules; mv extract_eval.md rules.md
            python extract_eval.py --limit 40 --reader model || true
            cat rules.md extract_eval.md > both.md && mv both.md extract_eval.md
          else
            ARGS="--commit --limit ${{ inputs.limit }} --reader ${{ inputs.reader }}"
            [ -n "${{ inputs.attributes }}" ] && ARGS="$ARGS --attributes ${{ inputs.attributes }}"
            python extract_eval.py $ARGS
          fi
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-eval
          path: extract_eval.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s extract_eval.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file extract_eval.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Generic reader: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
