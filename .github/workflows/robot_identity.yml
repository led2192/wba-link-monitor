# What would change if the robot said who it is (lanterN-bot) and obeyed robots.txt (robot_identity.py):
# a sample of watched pages read both ways, and each site's robots.txt. Read-only. Manual; on a pull request
# touching it, a sample of 40.
name: Robot identity

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "pages to try, one per site"
        default: "300"
  pull_request:
    paths: [robot_identity.py, .github/workflows/robot_identity.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        run: python robot_identity.py --sample "${{ inputs.sample || '40' }}"
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-identity
          path: robot_identity.md
          if-no-files-found: ignore
