name: SEC revenue

# Revenue from the SEC's machine-readable filings (XBRL companyfacts), scored against the validated
# 2025 answers (sec_facts.py). Read-only: the gold bases (GOLD_TOKEN), the companies' sec_cik, the SEC.
# Manual; a pull request touching it runs the first 300 answers and posts the table.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "answers (0 = all revenue answers of companies with an SEC CIK)"
        default: "0"
  pull_request:
    paths: [sec_facts.py, .github/workflows/sec_facts.yml]

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Score
        env:
          GOLD_TOKEN: ${{ secrets.GOLD_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS="--limit 300"
          else ARGS="--commit --limit ${{ inputs.limit }}"; fi
          python sec_facts.py $ARGS
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-facts
          path: sec_facts.md
          if-no-files-found: ignore
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s sec_facts.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file sec_facts.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "SEC revenue: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
