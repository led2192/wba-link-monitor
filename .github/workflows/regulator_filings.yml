name: Regulator filings (annual reports)

# Weekly: for every company with an official identifier (LEI, ISIN), look up its annual filings in
# the SEC (US) and ESEF (filings.xbrl.org, Europe and others) databases, and add the ones for fiscal
# years we hold no annual report for. Gap filling only; see regulator_filings.py.
on:
  schedule:
    - cron: "20 6 * * 1"        # Mondays 06:20 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run lists what would be added; commit adds it; mark-web relabels old filing rows (not_pdf) as web_document"
        type: choice
        default: "dry-run"
        options: [dry-run, commit, mark-web]
      source:
        description: "Which database"
        type: choice
        default: "all"
        options: [all, sec, esef, hkex, cninfo]
      wba:
        description: "Only these companies (comma-separated wba_ids). Blank = all."
        default: ""

  pull_request:
    paths: [regulator_filings.py, web_filing.py, .github/workflows/regulator_filings.yml]

concurrency:
  group: regulator-filings
  cancel-in-progress: false

jobs:
  filings:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Look up and add annual filings
        run: |
          ARGS=(--source "${{ inputs.source || 'all' }}" --wba "${{ inputs.wba }}")
          # a pull request: dry run on two companies listed in Hong Kong (Tencent) and Shanghai (Transsion)
          if [ "${{ github.event_name }}" = "pull_request" ]; then ARGS=(--source all --wba PT_01760,PT_01818); fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "commit" ]; then ARGS+=(--commit); fi
          if [ "${{ inputs.mode }}" = "mark-web" ]; then ARGS=(--mark-web --commit); fi
          python regulator_filings.py "${ARGS[@]}"
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s regulator_filings.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file regulator_filings.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Regulator filings: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
