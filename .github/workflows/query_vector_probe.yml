name: Query vector probe
# Manual. Asks Hugging Face's hosted inference for the query vector of a few questions and compares it with the vector
# the semantic index's own model makes (query_vector_probe.py). Reads and writes no database. Prints no secret.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-e5-small-${{ runner.os }}-v1
      - run: pip install -r requirements.txt sentence-transformers
      - run: python query_vector_probe.py --local
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
