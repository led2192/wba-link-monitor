# Examples for the terms of the reference list, cut from the reports (reference_examples.py): no model. Weekly, and
# by hand (dry, 40 terms, unless mode=commit). Prints counts only.
name: Reference examples

on:
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"

concurrency:
  group: reference-examples
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "commit" ]; then python reference_examples.py --commit
          else python reference_examples.py --limit 40; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
