# The documents table in lanterN's own database, beside Airtable's report_library (library_mirror.py): every field
# that moves, the year and the type worked out here, compared with Airtable's on every row. Phase 2 of leaving
# Airtable. Nightly after the Airtable writers of the night; manual for a first look (dry run unless commit).
name: Library mirror

on:
  workflow_dispatch:
    inputs:
      as_scheduled:
        description: "run as the nightly mirror: it writes (the clock ticks this)"
        type: boolean
        default: false
      commit:
        description: "write public.library (false = read and compare only)"
        type: boolean
        default: false
      limit:
        description: "documents at most (0 = all)"
        default: "0"

concurrency:
  group: library-mirror
  cancel-in-progress: false

jobs:
  mirror:
    # On lanterN's own machine when the repository variable LANTERN_JOBS names this job (docs/server.md).
    runs-on: ${{ fromJSON(contains(vars.LANTERN_JOBS, 'library_mirror') && '["self-hosted","lantern"]' || '"ubuntu-latest"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Where this runs
        run: echo "machine $RUNNER_NAME ($RUNNER_ENVIRONMENT), $(nproc) cores"
      - name: Mirror
        run: python library_mirror.py --limit "${{ inputs.limit || '0' }}" ${{ (inputs.as_scheduled || inputs.commit) && '--commit' || '' }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
