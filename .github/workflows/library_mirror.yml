# The documents table in lanterN's own database, beside Airtable's report_library (library_mirror.py): every field
# that moves, the year and the type worked out here, compared with Airtable's on every row. Phase 2 of leaving
# Airtable. Nightly after the Airtable writers of the night; manual for a first look (dry run unless commit).
name: Library mirror

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "write public.library (false = read and compare only)"
        type: boolean
        default: false
      limit:
        description: "documents at most (0 = all)"
        default: "0"
  schedule:
    - cron: "43 4 * * *"        # 04:43 UTC

concurrency:
  group: library-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mirror
        run: python library_mirror.py --limit "${{ inputs.limit || '0' }}" ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
