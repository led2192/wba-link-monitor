name: Fiscal years

# Reads the full text of each new document (the text store built by "Build full text") and writes
# fiscal_year, period_end, year_score, year_basis and year_evidence on report_library. Chained after
# the nightly full-text build, so only newly read documents are processed. Manual runs: dry run by
# default; "all" re-reads every document (after a rule change).

on:
  workflow_run:
    workflows: ["Build full text"]
    types: [completed]
  workflow_dispatch:
    inputs:
      as_scheduled:
        description: "set by lantrNa's clock (server/clock.json): run as the nightly run does"
        default: "false"
      commit:
        description: "WRITE the years. Leave OFF for a dry run."
        type: boolean
        default: false
      all:
        description: "Re-read every document, not only new ones"
        type: boolean
        default: false
      limit:
        description: "At most this many documents (0 = all)"
        default: "0"

concurrency:
  group: fiscal-years
  cancel-in-progress: false

jobs:
  years:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, lantern]      # on lantrNa's server since the move of 21 Nov 2026 (GitHub's machines before)
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Read fiscal years
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          TEXT_STORE_REPO: ${{ vars.TEXT_STORE_REPO }}
          TEXT_STORE_TOKEN: ${{ secrets.TEXT_STORE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ inputs.as_scheduled }}" = "true" ]; then
            python fiscal_years.py --commit
          else
            ARGS="--limit ${{ inputs.limit }}"
            [ "${{ inputs.commit }}" = "true" ] && ARGS="$ARGS --commit"
            [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
            python fiscal_years.py $ARGS
          fi
