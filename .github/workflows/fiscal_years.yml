name: Fiscal years

# Reads the full text of each new document (the text store built by "Build full text") and writes
# fiscal_year, period_end, year_score, year_basis and year_evidence on report_library. Chained after
# the nightly full-text build, so only newly read documents are processed. Manual runs: dry run by
# default; "all" re-reads every document (after a rule change).

on:
  workflow_run:
    workflows: ["Build full text"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: "WRITE the years. Leave OFF for a dry run."
        type: boolean
        default: false
      all:
        description: "Re-read every document, not only new ones"
        type: boolean
        default: false
      limit:
        description: "At most this many documents (0 = all)"
        default: "0"

concurrency:
  group: fiscal-years
  cancel-in-progress: false

jobs:
  years:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read fiscal years
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          TEXT_STORE_REPO: ${{ vars.TEXT_STORE_REPO }}
          TEXT_STORE_TOKEN: ${{ secrets.TEXT_STORE_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python fiscal_years.py --commit
          else
            ARGS="--limit ${{ inputs.limit }}"
            [ "${{ inputs.commit }}" = "true" ] && ARGS="$ARGS --commit"
            [ "${{ inputs.all }}" = "true" ] && ARGS="$ARGS --all"
            python fiscal_years.py $ARGS
          fi
