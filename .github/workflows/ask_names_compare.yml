# Option ask_metric_names beside today's answers (ask_names_compare.py). Manual only. CALLS THE PAID READER: three
# calls a question, about 0.3 US cents a question; the owner allowed it on 15 Nov 2026. Keeps nothing in the
# database. Prints counts only.
name: Ask names comparison

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "questions at most (three reader calls each)"
        default: "30"

concurrency:
  group: ask-names-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare
        run: python ask_names_compare.py --limit "${{ inputs.limit || '30' }}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          QA_COMMIT: "true"
