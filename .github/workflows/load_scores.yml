# The companies' benchmark results from the WBA Data API, for lanterN's company card (load_scores.py).
# First step: a look at what the API serves (datasets, columns, a sample row). By hand, and on a PR that touches it.
name: Benchmark scores

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "datasets whose columns and a sample row are printed"
        default: "benchmarks,measurementareas"
  pull_request:
    paths: [load_scores.py, .github/workflows/load_scores.yml]

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Look
        run: python load_scores.py --datasets "${{ inputs.datasets || 'benchmarks,measurementareas' }}"
        env:
          WBA_DATA_API_KEY: ${{ secrets.WBA_DATA_API_KEY }}
