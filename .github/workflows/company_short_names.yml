# The name each company is called by: its listed name without the legal form, judged on the pages
# (company_short_names.py). Weekly, and by hand (dry unless mode=commit). Prints counts only.
name: Company short names

on:
  schedule:
    - cron: "13 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"
      by_day:
        description: "yes: a commit run may start in the hours people search (it loads the database)"
        default: "no"

concurrency:
  group: heavy-database      # one of the jobs that load the database at a time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "commit" ]; then python company_short_names.py --commit ${{ inputs.by_day == 'yes' && '--by-day' || '' }}
          else python company_short_names.py; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
