name: Evidence database load

# Copies the full-text store (pages and evidence passages) into the Supabase evidence database
# (load_supabase.py). Twice a night (19:41 and 01:41 UTC) it loads whatever is new, until 06:00 UTC at
# the latest: a load slows every search (28 Oct 2026: the morning load of the night's new text ran
# from 07:14 to 11:04 Madrid and searches timed out), so it stays out of working hours. It stops when
# the database reaches SUPABASE_MAX_GB (repository variable; 6 GB when unset, which fits the 8 GB
# disk a new project starts with). Once nothing is left to load it hands the word index build to the
# database (pg_cron job build-pages-search: over three hours on the full corpus, longer than a job may
# run). A pull
# request touching it runs a dry run (schema checked and rolled back) and posts what is waiting.
on:
  schedule:
    - cron: "41 19,1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run or commit"
        default: "dry_run"
      parts:
        description: "at most this many pages files (0 = all waiting)"
        default: "0"
      minutes:
        description: "time budget in minutes (0 = install the search functions and refresh documents only, no pages: quick)"
        default: "300"
  pull_request:
    paths: [load_supabase.py, supabase/schema.sql, .github/workflows/load_supabase.yml]

concurrency:
  group: load-supabase
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Load
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TEXT_STORE_REPO: ${{ vars.TEXT_STORE_REPO }}
          TEXT_STORE_TOKEN: ${{ secrets.TEXT_STORE_TOKEN }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
          MAX_GB: ${{ vars.SUPABASE_MAX_GB || '6' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
               # never past 06:00 UTC (07:00 Madrid in winter): loading slows every search
               LEFT=$(( ( $(date -u -d 'tomorrow 06:00' +%s) - $(date -u +%s) ) / 60 % 1440 ))
               [ "$LEFT" -gt 300 ] && LEFT=300
               ARGS="--commit --index --minutes $LEFT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then ARGS=""
          else ARGS="--parts ${{ inputs.parts }} --minutes ${{ inputs.minutes }}"
               [ "${{ inputs.mode }}" = "commit" ] && ARGS="$ARGS --commit --index"; fi
          python load_supabase.py $ARGS --max-gb "$MAX_GB"
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -s load_supabase.md ]; then gh pr comment ${{ github.event.pull_request.number }} --body-file load_supabase.md
          else gh pr comment ${{ github.event.pull_request.number }} --body "Evidence database load: no result (the run failed; see the job log)."; fi
        env:
          GH_TOKEN: ${{ github.token }}
