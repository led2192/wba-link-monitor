# Document types from the first pages: a model types the live documents that have a cover text and no type at all
# (the Airtable AI field types English documents only; the address and cover-title rules leave about 45,000 without
# a type, 28,500 of them in other languages). Manual. Dry run unless commit is true; --check N measures the reader
# against the types already set before anything is written. About $0.0003 a document at the Haiku list price.
name: Type covers

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "write source_type_check on the typed rows (false = print what would be written)"
        type: boolean
        default: false
      limit:
        description: "at most this many documents (0 = the whole queue)"
        default: "200"
      check:
        description: "read this many documents already typed and report the agreement, writing nothing (0 = type the queue instead)"
        default: "0"
      languages:
        description: "other: not the English rows, which the AI field types; all: every untyped row"
        type: choice
        options: [other, all]
        default: other
      max_usd:
        description: "stop at this estimated cost; what was read is written"
        default: "5"
      model:
        description: "the model that types: a Claude model name, or a Gemini one (gemini-...; GEMINI_API_KEY, the free credits)"
        default: "claude-haiku-5-5"
      workers:
        description: "model calls in flight at once"
        default: "4"

concurrency:
  group: type-covers
  cancel-in-progress: false

jobs:
  type:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Type
        run: |
          ARGS="--limit ${{ inputs.limit }} --languages ${{ inputs.languages }} --max-usd ${{ inputs.max_usd }} --workers ${{ inputs.workers || '4' }}"
          [ "${{ inputs.check }}" != "0" ] && ARGS="$ARGS --check ${{ inputs.check }}"
          [ "${{ inputs.commit }}" = "true" ] && [ "${{ inputs.check }}" = "0" ] && ARGS="$ARGS --commit"
          echo "python type_covers.py $ARGS"
          python type_covers.py $ARGS
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          READER_MODEL: ${{ inputs.model }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-covers-${{ github.run_id }}
          path: type_covers.md
          if-no-files-found: ignore
