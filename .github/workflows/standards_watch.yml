# What the standard-setters name on their own pages and the reference list does not hold (standards_watch.py): the
# addresses the list's entries carry, read as lanterN-bot where robots.txt allows, slowly. No model. Weekly (the server's
# clock), and by hand (dry unless mode=commit). Prints counts only.
name: Standards watch

on:
  workflow_dispatch:
    inputs:
      as_scheduled:
        description: "what the clock on the server starts: a commit run (server/clock.json)"
        type: boolean
        default: false
      mode:
        description: "dry_run or commit"
        default: "dry_run"

concurrency:
  group: standards-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: [self-hosted, lantern]      # lantrNa's server
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Load
        run: |
          if [ "${{ inputs.as_scheduled }}" = "true" ] || [ "${{ inputs.mode }}" = "commit" ]; then python standards_watch.py --commit
          else python standards_watch.py; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_QA_TOKEN: ${{ secrets.AIRTABLE_QA_TOKEN }}
          AIRTABLE_QA_BASE: appJQ2mRtjHjzLq9E
