# Backfill + daily top-up: report_library AND monitored_links -> companies record links (see link_companies.py).
# The first --commit run links the whole historical corpus (~75-90 min); after that the
# daily schedule links only the rows harvested overnight (link = BLANK() filter), a
# couple of minutes. Runs at 07:03 UTC, after the nightly cascade has finished.
name: Link and assign

on:
  schedule:
    - cron: "3 7 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Write changes (unchecked = dry-run)"
        type: boolean
        default: false

jobs:
  link:
    runs-on: [self-hosted, lantern]      # on lantrNa's server since the move of 22 Nov 2026 (GitHub's machines before)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: The server's own Python (kept on its disk, shared by its runners)
        run: |
          [ -x /srv/lantern/venv/bin/python ] || python3 -m venv /srv/lantern/venv
          echo "/srv/lantern/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Link records to companies
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: python link_companies.py ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
      - name: Reconcile analyst assignment
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE: ${{ secrets.AIRTABLE_BASE }}
        run: python assign_analysts.py ${{ (github.event_name == 'schedule' || inputs.commit) && '--commit' || '' }}
