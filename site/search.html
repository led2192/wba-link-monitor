<style>
  /* Brand colours: --brand (dark), --accent (buttons, links), --flame (the lantern's light). Swap these three for
     WBA's own hex codes; everything else follows. */
  /* WBA brand (branding guide, theme colours): navy 00194B, blue 2378FF and 1E64CC, yellow FAC300, green 4BB42D,
     red FF3C23, teal 0FC8BE. The lantern's light is the brand yellow; buttons and links the deeper blue (contrast). */
  :root {
    --brand: #00194B; --accent: #1E64CC; --flame: #FAC300; --blue: #2378FF;
    --bg: #FBFBF8; --fg: var(--brand); --muted: #4F5B70; --line: #E1E5EC; --box: #FFFFFF;
    --accent-2: var(--flame); --mark: #FFF3B8; --chip: #EDF2FA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
      --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
    --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 28px; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap > :not(footer) { flex: none; }
  header { display: flex; align-items: center; padding: 24px 0 6px; }
  header.home { justify-content: center; padding-top: 24vh; }
  .brand { display: block; line-height: 0; }
  .brand svg { width: 232px; height: 50px; display: block; }
  /* the lamp and the name, not the drawing with its faint beam, sit over the middle of the box: the beam's tail is empty space on the right */
  header.home .brand svg { width: 460px; max-width: 92vw; height: auto; transform: translateX(12.1%); }
  .brand .lamp { fill: var(--brand); } .brand .glass { fill: var(--bg); } .brand .flame { fill: var(--flame); }
  .brand .l1 { fill: var(--brand); } .brand .l7 { fill: #1E64CC; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .lamp, :root:not([data-theme="light"]) .brand .l1 { fill: #ECEFF4; }
                                        :root:not([data-theme="light"]) .brand .l7, :root:not([data-theme="light"]) .brand .l2 { fill: #6FA8FF; } }
  :root[data-theme="dark"] .brand .lamp, :root[data-theme="dark"] .brand .l1 { fill: #ECEFF4; }
  :root[data-theme="dark"] .brand .l7, :root[data-theme="dark"] .brand .l2 { fill: #6FA8FF; }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
  footer a:hover { color: var(--accent); }
  form.box { display: flex; gap: 0; width: 100%; margin: 14px 0 6px; align-items: stretch; }
  header.home + form.box { max-width: 640px; margin: 26px auto 10px; }
  .box .qwrap { position: relative; flex: 1; display: flex; min-width: 0; }

  .box .askbtn:hover { box-shadow: 0 0 0 1px var(--line); }
  .box .askbtn svg { width: 16px; height: 16px; color: var(--accent); }
  .answer { max-width: 760px; margin: 10px 0 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--box); }
  .answer .cap { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .answer .text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .answer .text a { color: var(--accent); text-decoration: none; font-size: 12px; vertical-align: super; }
  .answer ol { margin: 10px 0 0; padding-left: 20px; font-size: 12.5px; color: var(--muted); }
  .answer ol a { color: var(--accent); text-decoration: none; }

  .box .funnel { flex: none; margin-left: 10px; width: 44px; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 22px;

  .box .funnel:hover, .box .funnel[aria-expanded="true"] { color: var(--accent); border-color: var(--line); background: var(--box); }

  .boxwrap { position: relative; width: 100%; }
  header.home ~ .boxwrap { max-width: 640px; margin: 26px auto 10px; }
  header.home ~ .boxwrap form.box { margin: 0; }
  header.home ~ .boxwrap .funnel { position: absolute; left: calc(100% + 8px); top: 0; height: 100%; margin-left: 0; }   /* the box itself sits in the middle */

  .homebtns { display: none; }

  .homebtns button { font: inherit; font-size: 14.5px; padding: 9px 18px; border: 1px solid transparent; border-radius: 8px; background: var(--chip);
                     color: var(--fg); cursor: pointer; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; min-height: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--chip); border: 1px solid var(--line);
          border-radius: 16px; padding: 3px 10px 3px 12px; }
  .chip b { font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .filters { margin: 6px 0 14px; font-size: 14px; color: var(--muted); }
  .filters[hidden] { display: none; }
  header.home ~ .filters { max-width: 640px; margin-left: auto; margin-right: auto; }
  .filters .row { display: grid; grid-template-columns: 1fr 90px 90px 1fr; gap: 8px; margin-top: 8px; }
  .filters input, .filters select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                                    background: var(--box); color: var(--fg); min-width: 0; }
  @media (max-width: 560px) { .filters .row { grid-template-columns: 1fr 1fr; } }
  .status .dym { margin-top: 4px; font-size: 15px; color: var(--fg); } .status .dym a { font-weight: 600; font-style: italic; }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0 10px; min-height: 20px; }

  .values[hidden] { display: none; }

  .missing { margin: 18px 0 6px; font-size: 13px; }

  .unheld-h { color: var(--muted, #5b6675); margin-bottom: 6px; }

  .unheld-t { color: var(--muted, #5b6675); font-size: 13px; }
  .missing a { color: var(--muted); }

  .me { max-width: calc(100vw - 36px); }
  .values summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  .values summary::-webkit-details-marker { display: none; }

  .values .v + .v { margin-top: 0; }
  .values .what { color: var(--muted); }
  .values .num { font-size: 16px; font-weight: 600; color: var(--fg); }
  .values .num small { font-weight: 400; color: var(--muted); font-size: 12px; }

  .values .ev a { color: var(--accent); }
  .values .btns { display: flex; gap: 4px; align-items: start; }
  .values .btns button { width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .values .btns button:hover { border-color: var(--accent); color: var(--accent); }

  .values .fix { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 4px; }

  .values .fix .two { display: grid; grid-template-columns: 1fr 80px; gap: 6px; }

  .values .card { padding: 8px 0 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .values .card .name { font-weight: 600; font-size: 15px; color: var(--brand); }
  .values .card a { color: var(--accent); text-decoration: none; }
  .values .scores { margin-top: 8px; }
  .values .scores .cap { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .values .scores details { font-size: 12.5px; padding: 2px 0; }
  .values .scores summary { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; }
  .values .scores summary::-webkit-details-marker { display: none; }
  .values .scores summary .bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .values .scores .pl { color: var(--muted); font-size: 11.5px; }

  .values .scores details:not([open]) .pl { display: block; }
  .values .subhead { font-size: 12px; color: var(--muted); text-transform: none; padding: 10px 0 2px; border-top: 1px solid var(--line); margin-top: 6px; }
  /* While a card is up it is the page: the search box, its chips and the status line step aside (11 Nov 2026: the

  body.playing .boxwrap, body.playing #chips, body.playing #filters, body.playing #answer, body.playing #status, body.playing #strip, body.playing #homebtns { display: none !important; }
  .lucky .top a { color: var(--accent); text-decoration: none; }

  .lucky .who { font-size: 14px; color: var(--muted); }

  /* The panel stands beside the results when the window has room for both (760 + 16 + 310). Between that and a

  }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; font-size: 13px; }
  .strip .lbl { color: var(--muted); margin-right: 4px; }

  .strip .co:hover { border-color: var(--accent); color: var(--accent); }

          color: var(--fg); border-radius: 20px; cursor: pointer; }

<script>
(() => {
  const CONFIG = { url: "__SUPABASE_URL__", key: "__SUPABASE_PUBLISHABLE_KEY__" };
  const CLIENT = "lantern v39 2026-11-11";
  const TYPES = ["Annual Report", "Integrated Report", "Sustainability Report", "ESG Report", "CSR Report", "Climate Report",
    "Environmental Reports", "Social Reports", "Impact Report", "CDP Report", "GRI", "SASB Index", "Engagement Report",
    "Financial Statement", "10K Form", "Registration Document", "Interim Reports", "Company Presentations", "Statutory Documents",
    "Policy Documents", "Code of Conduct", "Human Rights Policy", "Certifications", "UNKNOWN"];
  // A type of document is often a family: what one company files as a 10-K is another's annual report, and a sustainability
  // report is elsewhere an ESG, CSR or Impact report. The family goes to the search as several types, the first listed first.
  const ANNUAL = "10K Form;Annual Report;Integrated Report", SUSTAIN = "Sustainability Report;ESG Report;CSR Report;Impact Report;Integrated Report";
  const TYPE_LABEL = { [ANNUAL]: "Annual report, 10-K", [SUSTAIN]: "Sustainability, ESG, CSR, Impact" };
  // one word that names a family, when it is all that is asked of a company ("Nike annual"): the documents, not the pages that say "annual"
  const TYPE_ALONE = { annual: ANNUAL, anual: ANNUAL, annuel: ANNUAL, sustainability: SUSTAIN, sostenibilidad: SUSTAIN, esg: SUSTAIN, csr: SUSTAIN };
  const TYPE_WORDS = { "annual report": ANNUAL, "informe anual": ANNUAL, "memoria anual": ANNUAL, "rapport annuel": ANNUAL,
    "integrated report": "Integrated Report", "informe integrado": "Integrated Report",
    "sustainability report": SUSTAIN, "informe de sostenibilidad": SUSTAIN, "memoria de sostenibilidad": SUSTAIN,
    "esg report": "ESG Report", "informe esg": "ESG Report", "csr report": "CSR Report", "climate report": "Climate Report", "informe climático": "Climate Report",
    "10-k": "10K Form", "10k": "10K Form",
    "code of conduct": "Code of Conduct", "code of ethics": "Code of Conduct", "código de conducta": "Code of Conduct", "codigo de conducta": "Code of Conduct",
    "código de comportamiento": "Code of Conduct", "codigo de comportamiento": "Code of Conduct", "código ético": "Code of Conduct", "código de ética": "Code of Conduct", "code de conduite": "Code of Conduct",
    "human rights policy": "Human Rights Policy", "política de derechos humanos": "Human Rights Policy",
    "policy": "Policy Documents", "política": "Policy Documents", "presentation": "Company Presentations", "presentación": "Company Presentations" };
  // Headquarters countries as the profiles hold them (ISO 3-letter), with the names people type (English and Spanish).
  const COUNTRIES = { AGO: ["Angola"], ARE: ["United Arab Emirates", "UAE", "Emiratos Árabes Unidos"], ARG: ["Argentina"], AUS: ["Australia"], AUT: ["Austria"],
    AZE: ["Azerbaijan", "Azerbaiyán"], BEL: ["Belgium", "Bélgica"], BGD: ["Bangladesh"], BMU: ["Bermuda", "Bermudas"], BRA: ["Brazil", "Brasil"], CAN: ["Canada", "Canadá"],
    CHE: ["Switzerland", "Suiza"], CHL: ["Chile"], CHN: ["China"], CIV: ["Ivory Coast", "Côte d'Ivoire", "Costa de Marfil"], COD: ["DR Congo", "Congo"], COL: ["Colombia"],
    CZE: ["Czech Republic", "Czechia", "Chequia"], DEU: ["Germany", "Alemania"], DNK: ["Denmark", "Dinamarca"], DZA: ["Algeria", "Argelia"], ECU: ["Ecuador"], EGY: ["Egypt", "Egipto"],
    ESP: ["Spain", "España"], EST: ["Estonia"], ETH: ["Ethiopia", "Etiopía"], FIN: ["Finland", "Finlandia"], FRA: ["France", "Francia"], GBR: ["United Kingdom", "UK", "Britain", "Reino Unido"],
    GRC: ["Greece", "Grecia"], HKG: ["Hong Kong"], HUN: ["Hungary", "Hungría"], IDN: ["Indonesia"], IND: ["India"], IRL: ["Ireland", "Irlanda"], IRN: ["Iran", "Irán"], IRQ: ["Iraq", "Irak"],
    ISR: ["Israel"], ITA: ["Italy", "Italia"], JAM: ["Jamaica"], JPN: ["Japan", "Japón"], KAZ: ["Kazakhstan", "Kazajistán"], KEN: ["Kenya", "Kenia"], KOR: ["South Korea", "Korea", "Corea"],
    KWT: ["Kuwait"], LBY: ["Libya", "Libia"], LIE: ["Liechtenstein"], LUX: ["Luxembourg", "Luxemburgo"], MAR: ["Morocco", "Marruecos"], MEX: ["Mexico", "México"], MUS: ["Mauritius", "Mauricio"],
    MYS: ["Malaysia", "Malasia"], NGA: ["Nigeria"], NLD: ["Netherlands", "Holland", "Países Bajos", "Holanda"], NOR: ["Norway", "Noruega"], NPL: ["Nepal"], NZL: ["New Zealand", "Nueva Zelanda"],
    OMN: ["Oman", "Omán"], PAK: ["Pakistan", "Pakistán"], PER: ["Peru", "Perú"], PHL: ["Philippines", "Filipinas"], POL: ["Poland", "Polonia"], PRT: ["Portugal"], PSE: ["Palestine", "Palestina"],
    QAT: ["Qatar", "Catar"], RUS: ["Russia", "Rusia"], SAU: ["Saudi Arabia", "Arabia Saudita", "Arabia Saudí"], SDN: ["Sudan", "Sudán"], SGP: ["Singapore", "Singapur"], SWE: ["Sweden", "Suecia"],
    THA: ["Thailand", "Tailandia"], TKM: ["Turkmenistan", "Turkmenistán"], TUR: ["Turkey", "Türkiye", "Turquía"], TWN: ["Taiwan", "Taiwán"], TZA: ["Tanzania"], UKR: ["Ukraine", "Ucrania"],
    URY: ["Uruguay"], USA: ["United States", "USA", "US", "America", "Estados Unidos", "EEUU"], VEN: ["Venezuela"], VNM: ["Vietnam"], ZAF: ["South Africa", "Sudáfrica"], ZWE: ["Zimbabwe"] };
  const REGION_ALIASES = { "East Asia & Pacific": ["Asia Pacific", "Asia", "APAC", "Asia-Pacific", "Asia y Pacífico"], "Europe & Central Asia": ["Europe", "Europa", "EMEA"],
    "North America": ["North America", "Norteamérica", "América del Norte"], "Latin America & Caribbean": ["Latin America", "LatAm", "Latinoamérica", "América Latina", "Caribbean"],
    "South Asia": ["South Asia", "Asia del Sur"], "Middle East & North Africa": ["Middle East", "MENA", "Oriente Medio", "North Africa"], "Sub-Saharan Africa": ["Africa", "África", "Sub-Saharan Africa"] };
  const INDUSTRY_ALIASES = { "Oil & Gas": ["oil and gas", "oil y gas", "petróleo y gas", "petroleo y gas", "oil", "gas"], "Metals & Mining": ["mining", "minería", "metals and mining"],
    "Apparel & Footwear": ["apparel", "fashion", "footwear", "moda"], "Food Production": ["food producers", "food production", "alimentación"], "Food Retailers": ["food retail", "supermarkets", "supermercados"],
    "Motor Vehicles & Parts": ["automotive", "carmakers", "automóviles", "cars"], "Banks": ["banking", "banca", "bancos"], "Utilities": ["electric utilities", "eléctricas"],
    "Telecommunications": ["telecom", "telecoms", "telecomunicaciones"], "Construction & Engineering": ["construction", "construcción"], "Pension Funds": ["pensions", "pension funds", "pensiones"] };
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // The key travels in the link (#k=...), stays in this browser and never in the address bar afterwards.
  let key = null;
  try {
    const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
    if (m) { localStorage.setItem("find_key", m[1]); history.replaceState(null, "", location.pathname + location.search); }
    key = localStorage.getItem("find_key");
  } catch (e) { key = null; }
  if (!key) {
    $("notice").innerHTML = '<div class="notice"><b>Open the link you were given.</b><br>This page works from a shared link that carries its key; ask the data team for it. Nothing else is needed, no account and no password.</div>';
    $("boxwrap").style.display = "none"; $("filters").hidden = true;
    return;
  }

  let companies = [];
  const state = { q: "", company: null, companyName: null, from: null, to: null, type: null, industry: null, country: null, countryName: null, region: null, rows: 50, logId: null };
  let industries = [], regions = [];

  async function rpc(fn, body) {
    const r = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
      method: "POST", headers: { apikey: CONFIG.key, Authorization: `Bearer ${CONFIG.key}`, "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    if (!r.ok) {
      let msg = `${r.status}`;
      try { const j = await r.json(); msg = j.message || j.hint || msg; } catch (e) {}
      if (r.status === 401 || r.status === 403 || /not allowed/.test(msg)) { try { localStorage.removeItem("find_key"); } catch (e) {} }
      throw new Error(msg);
    }
    return r.json();
  }

  async function loadCompanies() {
    try {
      companies = await rpc("find_companies", { key });
      industries = [...new Set(companies.map(c => c.industry).filter(Boolean))].sort();
      regions = [...new Set(companies.map(c => c.region).filter(Boolean))].sort();
      const dl = $("companies"); dl.innerHTML = "";
      for (const c of companies) { const o = document.createElement("option"); o.value = c.name; dl.appendChild(o); }
    } catch (e) { setStatus(`Could not load the company list: ${e.message}`); }
  }
  for (const t of TYPES) { const o = document.createElement("option"); o.value = t; o.textContent = t; $("fType").appendChild(o); }

  // What the box says beyond words: every company named (longest names first, so "Nike Inc" wins over "Nike"), every
  // year named (one, a span 2022-2024, or several: the earliest to the latest), a document type.
  const WORD_NAMES = new Set("action apple block bolt canon dole grab liquid mars mosaic next target lumen orange shell visa oracle zoom subway snap vale meta amazon alphabet".split(" "));
  function parse(text) {
    let q = " " + text.trim().replace(/[?¿!¡]+/g, " ").replace(/\s+/g, " ") + " ";      // a question's marks are not words ("in 2024?" is the year 2024)
    const found = { company: null, companyName: null, from: null, to: null, type: null, industry: null, country: null, countryName: null, region: null };
    const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const take = (names) => { for (const n of names) { const re = new RegExp("\\s" + esc(n) + "\\s", "i"); if (re.test(q)) { q = q.replace(re, " "); return true; } } return false; };
    // Company names are matched without accents and whatever the case ("Nestlé" is the company "Nestle", "Loreal" is
    // "L'Oréal": 10 Nov 2026), and a name may be followed by a comma or a semicolon ("Unilever; Nestlé living wage").
    const fold = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    const hits = [];
    // (a name of two or three letters, "BP", "3M", "HP", is the company only as its name is written, capitals and all: "bp" may be a unit, "eni" a word)
    const byLength = companies.filter(c => (c.name || "").length >= 2).sort((a, b) => b.name.length - a.name.length);
    let fq = fold(q); const sameLength = () => fq.length === q.length;
    if (!sameLength()) { q = fq; }                                      // a letter that folds to two: search the folded text
    for (const c of byLength) {
      const name = fold(c.name).toLowerCase();
      if (!fq.toLowerCase().includes(name)) continue;      // the cheap test first: 2,000 names a keystroke
      const short = c.name.length < 4;
      const m = short ? new RegExp("\\s" + esc(fold(c.name)) + "(?:'s)?[;,]?(?=\\s)").exec(fq) : new RegExp("\\s" + esc(name) + "(?:'s)?[;,]?(?=\\s)", "i").exec(fq);
      if (!m) continue;
      // A company whose name is an everyday word ("target", "shell", "orange"): the company when it is written as a
      // name (a capital, or first in the box, or before a comma or semicolon), the word otherwise. 11 Nov 2026:
      // "unilever scope 3 emissions target" searched the companies Unilever and Target for "scope 3 emissions".
      if (WORD_NAMES.has(name)) {
        const typed = q.slice(m.index + 1, m.index + 2);
        if (!(typed !== typed.toLowerCase() || fold(text.trim()).toLowerCase().startsWith(name) || /[;,]$/.test(m[0]))) { found.maybe = found.maybe || { id: c.id, name: c.name, word: name }; continue; }
      }
      hits.push(c);
      q = q.slice(0, m.index) + " " + q.slice(m.index + m[0].length);
      fq = fq.slice(0, m.index) + " " + fq.slice(m.index + m[0].length);
      if (hits.length >= 6) break;
    }
    if (hits.length) q = q.replace(/\s[;,](?=\s)/g, " ");
    if (hits.length) { found.company = hits.map(c => c.id).join(";"); found.companyName = hits.map(c => c.name).join(", "); }
    // then the profiles (an industry name like "Oil & Gas" or a country must not be read as words), longest names first.
    // Companies come before them: "Basra Oil Company" is a company, not the Oil & Gas industry and the word "Basra"
    // (11 Nov 2026; 104 company names hold an industry's word, and others a country's: "Bank of China")
    // With a company named, an industry or a country adds nothing as a filter, so the words stay words ("Shell oil spills").
    if (!hits.length) {
      for (const ind of [...industries].sort((a, b) => b.length - a.length)) {
        const names = [ind, ind.replace(/ & /g, " and "), ind.replace(/ & /g, " y "), ...(INDUSTRY_ALIASES[ind] || [])];
        if (take(names)) { found.industry = ind; break; }
      }
      for (const [code, names] of Object.entries(COUNTRIES)) { if (take([...names, code])) { found.country = code; found.countryName = names[0]; break; } }
      for (const reg of regions) { if (take([reg, reg.replace(/ & /g, " and "), ...(REGION_ALIASES[reg] || [])])) { found.region = reg; break; } }
    }
    const years = [];
    q = q.replace(/\s(20[0-3]\d)\s*[-–]\s*(20[0-3]\d)(?=\s)/g, (m, a, b) => { years.push(+a, +b); return " "; });
    q = q.replace(/\s(20[0-3]\d)(?=\s)/g, (m, a) => { years.push(+a); return " "; });
    if (years.length) { found.from = Math.min(...years); found.to = Math.max(...years); }
    for (const [w, t] of Object.entries(TYPE_WORDS)) {
      const re = new RegExp("\\s" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s?\\s", "i");
      if (re.test(q)) { found.type = t; found.typeWords = w; q = q.replace(re, " "); break; }
    }
    const alone = q.trim().toLowerCase();
    if (!found.type && found.company && TYPE_ALONE[alone]) { found.type = TYPE_ALONE[alone]; found.typeWords = alone; q = " "; }
    return { q: q.trim(), ...found };
  }

  function setStatus(t) { $("status").textContent = t; }

  function renderChips() {
    const box = $("chips"); box.innerHTML = "";
    const add = (label, value, clear) => {
      const c = el("span", "chip"); c.append(el("span", null, label + " "), el("b", null, value));
      const x = el("button", null, "×"); x.title = "Remove this filter"; x.onclick = () => { clear(); search(true); }; c.appendChild(x); box.appendChild(c);
    };
    if (state.company) add(state.company.includes(";") ? "Companies" : "Company", state.companyName || state.company, () => { state.company = state.companyName = null; $("fCompany").value = ""; });
    if (state.from || state.to) add("Years", state.from === state.to ? String(state.from) : `${state.from || ""}–${state.to || ""}`, () => { state.from = state.to = null; $("fFrom").value = $("fTo").value = ""; });
    if (state.type) add("Type", TYPE_LABEL[state.type] || state.type, () => { state.type = null; $("fType").value = ""; });
    if (state.industry) add("Industry", state.industry, () => { state.industry = null; });
    if (state.country) add("Country", state.countryName || state.country, () => { state.country = state.countryName = null; });
    if (state.region) add("Region", state.region, () => { state.region = null; });
  }

    showMe(sc);
    c.appendChild(top);
    c.append(el("div", "who", [v.company, v.industry, v.country].filter(Boolean).join(" · ")));
    c.append(el("h2", null, `${ATTR_NAME[v.attribute] || v.attribute} · ${v.year}`));
    const big = el("div", "big", fmt(v.value) + " "); big.append(el("small", null, [v.unit, v.basis].filter(Boolean).join(", "))); c.appendChild(big);
    const facts = el("dl");
    const fact = (k, val) => { if (val === null || val === undefined || val === "") return; facts.append(el("dt", null, k), typeof val === "string" ? el("dd", null, val) : (() => { const d = el("dd"); d.appendChild(val); return d; })()); };
    fact("In full", Number(v.value).toLocaleString("en", { maximumFractionDigits: 2 }) + (v.unit ? " " + v.unit : ""));
    fact("Read as", v.printed ? String(v.printed).slice(0, 60) + (v.column_label ? `, under “${String(v.column_label).slice(0, 60)}”` : "") : "");
    fact("Document", [v.label, v.doc_type].filter(Boolean).join(" · "));
    if (v.url) { const a = el("a", null, `Open the source at page ${v.page || "?"} ↗`); a.href = /\.pdf(\?|$)/i.test(v.url) || !/#/.test(v.url) ? `${v.url}#page=${v.page || 1}` : v.url; a.target = "_blank"; a.rel = "noopener"; fact("Page", a); }
    fact("Other readings", (v.others || v.differ) ? `${v.others || 0} more ${v.others === 1 ? "document gives" : "documents give"} this figure, ${v.differ || 0} give another` : "this is the only reading");
    c.appendChild(facts);
    if (v.excerpt) { const ex = el("div", "excerpt"); let t = escH(v.excerpt); if (v.needle) t = t.split(escH(v.needle)).join(`<mark>${escH(v.needle)}</mark>`);
                     ex.innerHTML = `<div class="cap">${v.needle ? "The page, around the figure" : "The page (the figure was not found as printed; open the source)"}</div>… ${t} …`; c.appendChild(ex); }
    const verdict = el("div", "verdict"); const yes = el("button", "yes", "✓ Right"), no = el("button", "no", "✗ Wrong"); verdict.append(yes, no); c.appendChild(verdict);
    // optional help for the team: a note with either verdict; with "wrong", the right value and where it is. Never required.
    card.extra = card.extra || { correct_value: "", source_url: "", source_page: "", comment: "" };
    const more = el("details", "extra"); more.open = !!(card.extra.correct_value || card.extra.source_url || card.extra.comment);
    const moreSum = el("summary", null, "Add a note"); more.appendChild(moreSum);
    const bind = (node, k) => { node.value = card.extra[k]; node.oninput = () => { card.extra[k] = node.value; if (card.saved) { save.disabled = !card.pick; } }; return node; };
    const rightV = bind(el("input"), "correct_value"); rightV.placeholder = "The right value, if you know it";
    const twoX = el("div", "two"); const linkX = bind(el("input"), "source_url"); linkX.placeholder = "Link to the document that has it"; const pgX = bind(el("input"), "source_page"); pgX.placeholder = "Page"; pgX.inputMode = "numeric"; twoX.append(linkX, pgX);
    const whyX = bind(el("textarea"), "comment"); whyX.rows = 2; whyX.placeholder = "A note for the team";
    more.append(rightV, twoX, whyX); c.appendChild(more);
    const msg = el("div", "what", card.saved ? `Saved as ${card.saved === "ok" ? "right" : "wrong"}. You can change it and save again.` : "");
    const nav = el("div", "nav"); const prev = el("button", "ghost", "← Previous"), save = el("button", "save", "Save"), next = el("button", "ghost", card.saved ? "Next →" : "Skip →");
    prev.disabled = deck.at <= 0; nav.append(prev, save, next);
    const paint = () => { yes.classList.toggle("on", card.pick === "ok"); no.classList.toggle("on", card.pick === "wrong"); save.disabled = !card.pick || card.pick === card.saved;
                          const wrong = card.pick === "wrong"; rightV.style.display = twoX.style.display = wrong ? "" : "none";
                          moreSum.textContent = wrong ? "Add the right value, where it is, or a note (optional)" : "Add a note (optional)"; };
    if (!card.pick && card.saved) card.pick = card.saved; paint();
    yes.onclick = () => { card.pick = card.pick === "ok" ? null : "ok"; paint(); }; no.onclick = () => { card.pick = card.pick === "wrong" ? null : "wrong"; paint(); };
    prev.onclick = () => lucky("prev"); next.onclick = () => lucky("next");
    save.onclick = async () => {
      save.disabled = true;
      try { const first = !card.saved; const wrong = card.pick === "wrong", x = card.extra;
            await review({ version_id: v.version_id, verdict: card.pick, seconds: Math.round((Date.now() - shownAt) / 1000), client: CLIENT + " lucky",
                           comment: x.comment || null, correct_value: wrong ? (x.correct_value || null) : null, source_url: wrong ? (x.source_url || null) : null,
                           source_page: wrong ? (parseInt(x.source_page, 10) || null) : null });
            card.saved = card.pick; if (first) { deck.score = Object.assign({}, deck.score, { points: Number(deck.score.points || 0) + 1, reviews: Number(deck.score.reviews || 0) + 1 }); } showMine(false); lucky("next"); }
      catch (e) { msg.textContent = `Not saved: ${e.message}`; paint(); }
    };
    const close = el("a", null, "Close"); close.href = "#"; close.onclick = e => { e.preventDefault(); luckyClose(); };
    const foot = el("div", "what"); foot.style.textAlign = "center"; foot.append(document.createTextNode(`Card ${deck.at + 1} of ${deck.cards.length} this session · arrow keys move · `), close);
    c.append(msg, nav, foot); box.appendChild(c);
  }
  document.addEventListener("keydown", e => {
    if (deck.at < 0 || !document.querySelector("#results .lucky") || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || "")) return;   // typing in the note moves nothing
    if (e.key === "ArrowLeft") lucky("prev"); else if (e.key === "ArrowRight") lucky("next");
  });

  function companyId(name) { const c = companies.find(x => (x.name || "").toLowerCase() === name.toLowerCase()); return c ? c.id : name; }

  // Your recent searches, in this browser only (the link's key is shared, so the database cannot tell people apart).
  const HIST = "find_history", HIST_MAX = 30;
  const history_ = { load() { try { return JSON.parse(localStorage.getItem(HIST) || "[]"); } catch (e) { return []; } },
                     save(h) { try { localStorage.setItem(HIST, JSON.stringify(h.slice(0, HIST_MAX))); } catch (e) {} },
                     add(q) { const h = this.load().filter(x => x.q !== q); h.unshift({ q, at: Date.now() }); this.save(h); },
                     remove(q) { this.save(this.load().filter(x => x.q !== q)); }, clear() { this.save([]); } };
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "now" : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
  // Under the box as one types: first what the words ARE (a company, an industry, a country: "nev" is the
  // company whose name starts so, before any past search that merely holds the letters), then one's own searches.
  // 11 Nov 2026, the owner: a web search offers the state of Nevada first, not any snowfall.
  const foldText = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  function entitiesFor(typed) {
    const t = foldText(typed).trim(); if (t.length < 2) return [];
    const out = [];
    const starts = [], inside = [];
    for (const c of companies) { const n = foldText(c.name); if (n.startsWith(t)) starts.push(c); else if (t.length >= 3 && n.split(/[^a-z0-9]+/).some(w => w.startsWith(t))) inside.push(c); }
    const byName = (a, b) => a.name.length - b.name.length || a.name.localeCompare(b.name);
    for (const c of [...starts.sort(byName), ...inside.sort(byName)].slice(0, 5)) out.push({ q: c.name, kind: "Company", note: [c.industry, c.country].filter(Boolean).join(" · "), id: c.id });
    for (const ind of industries) if (foldText(ind).startsWith(t) && out.length < 7) out.push({ q: ind, kind: "Industry", note: "every company in it" });
    for (const [code, names] of Object.entries(COUNTRIES)) if (names.some(n => foldText(n).startsWith(t)) && out.length < 8) out.push({ q: names[0], kind: "Country", note: "companies based there" });
    return out;
  }
  function renderHistory() {
    const box = $("history"), typed = $("q").value.trim().toLowerCase();
    const things = entitiesFor(typed);
    const named = new Set(things.map(x => x.q.toLowerCase()));
    const items = history_.load().filter(x => (!typed || x.q.toLowerCase().includes(typed)) && !named.has(x.q.toLowerCase())).slice(0, things.length ? 5 : 10);
    box.innerHTML = "";
    if (!items.length && !things.length) { box.classList.remove("open"); return; }
    for (const it of things) {
      const row = el("div", "h"); row.setAttribute("role", "option");
      const ico = it.id ? companyIcon(it.id) : null;
      if (ico) { ico.className = "ico"; ico.style.borderRadius = "4px"; row.appendChild(ico); }
      else row.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
      row.append(el("span", null, it.q), el("small", null, it.kind + (it.note ? " · " + it.note : "")));
      row.onmousedown = ev => { ev.preventDefault(); $("q").value = it.q; closeHistory(); search(false); };
      box.appendChild(row);
    }
    for (const it of items) {
      const row = el("div", "h"); row.setAttribute("role", "option");
      row.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      const t = el("span", null, it.q); const when = el("small", null, ago(it.at)); const x = el("button", null, "×"); x.title = "Forget this search";
      x.onclick = ev => { ev.stopPropagation(); history_.remove(it.q); renderHistory(); };
      row.append(t, when, x);
      row.onmousedown = ev => { ev.preventDefault(); $("q").value = it.q; closeHistory(); search(false); };
      box.appendChild(row);
    }
    if (items.length) { const f = el("div", "foot"); const c = el("button", null, "Clear my searches"); c.onmousedown = ev => { ev.preventDefault(); history_.clear(); renderHistory(); }; f.appendChild(c); box.appendChild(f); }
    box.classList.add("open");
  }
  function closeHistory() { $("history").classList.remove("open"); }
  $("q").addEventListener("focus", renderHistory);
  $("q").addEventListener("input", renderHistory);
  $("q").addEventListener("blur", () => setTimeout(closeHistory, 120));
  $("q").addEventListener("keydown", e => { if (e.key === "Escape") closeHistory(); });
  $("form").addEventListener("submit", e => { e.preventDefault(); closeHistory(); $("answer").innerHTML = ""; search(false); });
  // Ask: the question goes to the database, which finds the pages (the same search), gives the first lines of the best six
  // to the reader model and returns an answer that cites them. Signed in; three questions a day a person (counted there).
  async function ask() {
    const text = $("q").value.trim(), box = $("answer"); box.innerHTML = ""; const c = el("div", "answer"); box.appendChild(c);
    const cap = el("div", "cap"); cap.append(el("span", null, "Ask · an answer written from the pages found"), el("span", null, "")); c.appendChild(cap);
    const note = el("div", "what", ""); c.appendChild(note);
    if (text.length < 8) { note.textContent = "Type a question in the box first, for example: What were Unilever’s scope 1 emissions in 2024?"; return; }
    $("head").classList.remove("home"); closeHistory();
    const t = await token();
    if (!t) { note.textContent = "Ask answers from the pages lanterN finds and shows its sources. Three questions a day; sign in with your WBA address.";
              const hold = el("div", "values"); c.appendChild(hold); signInBox(hold, ask); return; }
    note.textContent = "Reading the pages…";
    search(false);                                           // the results under the answer, as for any search; it also reads the filters in the box
    let j = null;
    try {
      const r = await fetch(`${CONFIG.url}/rest/v1/rpc/ask`, { method: "POST", headers: { apikey: CONFIG.key, Authorization: `Bearer ${t}`, "Content-Type": "application/json" },
        body: JSON.stringify({ key, question: text, q: state.q || null, company_filter: state.company || null, year_from: state.from || null, year_to: state.to || null, type_filter: state.type || null, client: CLIENT }) });
      j = await r.json().catch(() => ({})); if (!r.ok) j = { error: j.message || `HTTP ${r.status}` };
    } catch (e) { j = { error: e.message }; }
    const left = typeof j.left === "number" ? `${j.left} of ${j.per_day || 3} questions left today` : ""; cap.lastChild.textContent = left;
    if (j.off) { note.textContent = `Ask is not switched on yet: ${j.why || "the model key is not in the database’s vault"}.`; return; }
    if (j.limit && j.everyone) { note.textContent = "Ask has answered all the questions it can today, for everyone. It comes back at midnight UTC; the search below still works."; return; }
    if (j.limit) { note.textContent = `You have asked today’s ${j.per_day || 3} questions. They come back at midnight UTC; the search below still works.`; return; }
    if (j.none) { note.textContent = "No page was found for this question" + (j.keywords ? ` (searched “${j.keywords}”)` : "") + ". Try other words, or name the company and the year." + (j.why ? ` [${j.why}]` : ""); return; }
    if (j.error || !j.answer) { note.textContent = `No answer: ${j.error || "the model returned nothing"}. This one does not count.`; return; }
    note.remove(); const src = j.sources || [];
    const body = el("div", "text"); body.innerHTML = escH(j.answer).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[(\d+)\]/g, (m, n) => { const s = src.find(x => String(x.n) === n); return s && s.url ? `<a href="${escH(pageUrl(s))}" target="_blank" rel="noopener" title="${escH(s.company + ", " + (s.year || "") + ", page " + s.page)}">[${n}]</a>` : m; });
    c.appendChild(body);
    const ol = el("ol"); for (const s of src) { const li = el("li"); const a = el("a", null, `${s.company} · ${s.year || "no year"} · ${s.doc_type || "document"} · page ${s.page}`); a.href = pageUrl(s); a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); ol.appendChild(li); }
    c.append(ol, el("div", "what", (j.keywords ? `Pages found by searching “${j.keywords.replace(/\s+/g, " ")}”. ` : "") + "Written by a model from these pages only. Check the source before using a figure."));
  }
  const pageUrl = s => !s.url ? "#" : (/#/.test(s.url) ? s.url : `${s.url}#page=${s.page || 1}`);
  $("askBtn").onclick = ask;
  $("funnel").addEventListener("click", () => { const f = $("filters"); f.hidden = !f.hidden; $("funnel").setAttribute("aria-expanded", String(!f.hidden)); if (!f.hidden) $("fCompany").focus(); });
  for (const id of ["fCompany", "fFrom", "fTo", "fType"]) $(id).addEventListener("change", () => { if ($("q").value.trim()) search(false); });
  $("foot").insertAdjacentHTML("beforebegin", '<div style="text-align:center;font-size:13px;margin-top:auto;padding-top:40px"><span id="luckyWrap"><a href="#" id="lucky">I’m feeling lucky</a><span class="sep"> · </span></span><span id="mine"></span></div>');
  $("goSearch").onclick = () => { closeHistory(); search(false); };
  $("goLucky").onclick = () => $("lucky").click();
  $("lucky").onclick = ev => { ev.preventDefault(); $("head").classList.remove("home"); $("q").value = ""; if (deck.at >= 0 && deck.cards.length) { deck.at--; } lucky("next"); window.scrollTo(0, 0); };
  $("foot").style.cssText = "margin-top:8px;padding-top:0"; showMine(false);
  $("foot").innerHTML = 'Every page of every report WBA holds, in any language · Powered by <a href="https://www.worldbenchmarkingalliance.org/" target="_blank" rel="noopener">World Benchmarking Alliance</a> · Searches, the pages opened and the ✓ ✗ marks are logged, without names, to improve the ranking. · <a href="#" id="share">Copy the link to share lanterN</a>';
  $("share").onclick = async ev => { ev.preventDefault(); const link = location.origin + location.pathname + "#k=" + key;       // the same key on another device or for a colleague: searching needs only the link; reviews, Ask and adding need a WBA sign-in
    try { await navigator.clipboard.writeText(link); ev.target.textContent = "Link copied: paste it to a colleague or open it on your other device"; } catch (e) { ev.target.textContent = link; } };
  loadCompanies().then(() => {
    const q0 = new URLSearchParams(location.search).get("q");
    if (q0) { $("q").value = q0; search(false); }
  });
})();
