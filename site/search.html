<style>
  /* Brand colours: --brand (dark), --accent (buttons, links), --flame (the lantern's light). Swap these three for
     WBA's own hex codes; everything else follows. */
  /* WBA brand (branding guide, theme colours): navy 00194B, blue 2378FF and 1E64CC, yellow FAC300, green 4BB42D,
     red FF3C23, teal 0FC8BE. The lantern's light is the brand yellow; buttons and links the deeper blue (contrast). */
  :root {
    --brand: #00194B; --accent: #1E64CC; --flame: #FAC300; --blue: #2378FF;
    --bg: #FBFBF8; --fg: var(--brand); --muted: #4F5B70; --line: #E1E5EC; --box: #FFFFFF;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
      --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
    --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 28px; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap > :not(footer) { flex: none; }
  header { display: flex; align-items: center; padding: 24px 0 6px; }
  header.home { justify-content: center; padding-top: 24vh; }
  .brand { display: block; line-height: 0; }
  .brand svg { width: 232px; height: 50px; display: block; }
  /* the lamp and the name, not the drawing with its faint beam, sit over the middle of the box: the beam's tail is empty space on the right */
  header.home .brand svg { width: 460px; max-width: 92vw; height: auto; transform: translateX(12.1%); }
  .brand .lamp { fill: var(--brand); } .brand .glass { fill: var(--bg); } .brand .flame { fill: var(--flame); }
  .brand .l1 { fill: var(--brand); } .brand .l7 { fill: #1E64CC; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .lamp, :root:not([data-theme="light"]) .brand .l1 { fill: #ECEFF4; }

  :root[data-theme="dark"] .brand .lamp, :root[data-theme="dark"] .brand .l1 { fill: #ECEFF4; }
  :root[data-theme="dark"] .brand .l7, :root[data-theme="dark"] .brand .l2 { fill: #6FA8FF; }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }

  .box .askbtn svg { width: 16px; height: 16px; color: var(--accent); }

  .chip b { font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .filters { margin: 6px 0 14px; font-size: 14px; color: var(--muted); }
  .filters[hidden] { display: none; }
  header.home ~ .filters { max-width: 640px; margin-left: auto; margin-right: auto; }
  .filters .row { display: grid; grid-template-columns: 1fr 90px 90px 1fr; gap: 8px; margin-top: 8px; }
  .filters input, .filters select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                                    background: var(--box); color: var(--fg); min-width: 0; }
  @media (max-width: 560px) { .filters .row { grid-template-columns: 1fr 1fr; } }
  .status .dym { margin-top: 4px; font-size: 15px; color: var(--fg); } .status .dym a { font-weight: 600; font-style: italic; }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0 10px; min-height: 20px; }

  .missing { margin: 18px 0 6px; font-size: 13px; }

  .missing a { color: var(--muted); }

  .me { max-width: calc(100vw - 36px); }
  .values summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }

  .values .btns button:hover { border-color: var(--accent); color: var(--accent); }

  .values .fix { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 4px; }

  .values .card { padding: 8px 0 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .values .card .name { font-weight: 600; font-size: 15px; color: var(--brand); }
  .values .card a { color: var(--accent); text-decoration: none; }
  .values .scores { margin-top: 8px; }

  .values .scores details { font-size: 12.5px; padding: 2px 0; }
  .values .scores summary { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; list-style: none; }

  .values .subhead { font-size: 12px; color: var(--muted); text-transform: none; padding: 10px 0 2px; border-top: 1px solid var(--line); margin-top: 6px; }
  /* While a card is up it is the page: the search box, its chips and the status line step aside (11 Nov 2026: the

  .lucky .top a { color: var(--accent); text-decoration: none; }

  .lucky .top { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .lucky .who { font-size: 14px; color: var(--muted); }

  // The slips between two words: a letter added, dropped, changed, or two neighbours swapped. Stops counting above `max`.

      fq = fq.slice(0, m.index) + " " + fq.slice(m.index + m[0].length);
      if (hits.length >= 6) break;
    }
    for (const w of weak) {                                             // a word-name first in the box: the company only when it is the one company named
      const m = !hits.length && new RegExp("\\s" + esc(w.name) + "(?:'s)?[;,]?(?=\\s)", "i").exec(fq);
      if (!m) { found.maybe = found.maybe || { id: w.c.id, name: w.c.name, word: w.name }; continue; }
      hits.push(w.c);
      q = q.slice(0, m.index) + " " + q.slice(m.index + m[0].length);
      fq = fq.slice(0, m.index) + " " + fq.slice(m.index + m[0].length);
    }
    if (hits.length) q = q.replace(/\s[;,](?=\s)/g, " ");
    // v97 (17 Nov 2026): a company's name typed wrong. "base year target severestal" named no company, so 1,300 pages
    // of every company came back in 17 to 21 s, three times in a row. With no company named, a word of six letters or
    // more that is one slip away from one company's name (two when it has nine letters or more), with the same first
    // letter, is kept as `typo`; search() takes it as the company only when the library does not know the word.
    if (!hits.length) found.typo = nearCompany(fq);
    if (hits.length) { found.company = hits.map(c => c.id).join(";"); found.companyName = hits.map(c => c.name).join(", "); }
    // then the profiles (an industry name like "Oil & Gas" or a country must not be read as words), longest names first.
    // Companies come before them: "Basra Oil Company" is a company, not the Oil & Gas industry and the word "Basra"
    // (11 Nov 2026; 104 company names hold an industry's word, and others a country's: "Bank of China")
    // With a company named, an industry or a country adds nothing as a filter, so the words stay words ("Shell oil spills").
    if (!hits.length) {
      for (const ind of [...industries].sort((a, b) => b.length - a.length)) {
        const names = [ind, ind.replace(/ & /g, " and "), ind.replace(/ & /g, " y "), ...(INDUSTRY_ALIASES[ind] || [])];
        if (take(names)) { found.industry = ind; break; }
      }
      // v90 (the owner asked about "food companies" and the survey went to banks and oil companies): a family of
      // industries by the first word of their names, when the question says "<word> companies" (or firms, sector,
      // industry, producers). "food companies" is Food Production and Food Retailers together; the filter takes several, joined by ";".
      if (!found.industry) {
        const family = {};
        for (const ind of industries) { const w = ind.split(/[\s&]+/)[0].toLowerCase(); if (w.length >= 3) (family[w] = family[w] || []).push(ind); }
        for (const [w, list] of Object.entries(family)) {
          if (take(["companies", "firms", "sector", "industry", "producers", "businesses"].map(k => `${w} ${k}`).concat([`empresas de ${w}`]))) { found.industry = list.join(";"); break; }
        }
      }
      for (const [code, names] of Object.entries(COUNTRIES)) { if (take([...names, code])) { found.country = code; found.countryName = names[0]; break; } }
      for (const reg of regions) { if (take([reg, reg.replace(/ & /g, " and "), ...(REGION_ALIASES[reg] || [])])) { found.region = reg; break; } }
    }
    const years = [];
    q = q.replace(/\s(20[0-3]\d)\s*[-–]\s*(20[0-3]\d)(?=\s)/g, (m, a, b) => { years.push(+a, +b); return " "; });
    q = q.replace(/\s(20[0-3]\d)(?=\s)/g, (m, a) => { years.push(+a); return " "; });
    if (years.length) { found.from = Math.min(...years); found.to = Math.max(...years); }
    // v80 (the owner, 16 Nov 2026): in a question the name of a kind of report is what is asked about, not a filter.
    // "Does Mercadona publish a separate sustainability report?" was searched only inside sustainability reports, found
    // nothing and could not be answered. The words stay words; the Type filter of the panel still filters a question.
    if (!isQuestion(text)) for (const [w, t] of Object.entries(TYPE_WORDS)) {
      const re = new RegExp("\\s" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s?\\s", "i");
      if (re.test(q)) { found.type = t; found.typeWords = w; q = q.replace(re, " "); break; }
    }

    if (!found.type && found.company && TYPE_ALONE[alone]) { found.type = TYPE_ALONE[alone]; found.typeWords = alone; q = " "; }
    return { q: q.trim(), ...found };
  }

  const csvCell = v => { let t = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(t)) t = "'" + t; return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const surveyCsv = g => [["Company", "WBA id", "Answer", "In short", "Year", "The sentence", "Document year", "Document type", "Page", "Link", "Question", "Scope", "Checked"]]
    .concat(g.rows.map(x => [x.company, x.wba_id, SURVEY_WORDS[x.status] || x.status, x.value, x.year, x.evidence, x.doc_year, x.doc_type, x.page, x.url && x.page ? pageUrl(x) : (x.url || ""), g.question,
                             [g.industry, g.region, g.country, g.year_from || g.year_to ? `${g.year_from || ""}-${g.year_to || ""}` : ""].filter(Boolean).join(", "), x.verdict || ""]))
    .map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
  const surveyFile = g => `survey-${g.id}-${String(g.question || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60)}.csv`;
  const saveText = (name, text) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  let surveyRun = 0;                                     // a newer run, or leaving the section, stops the loop of an older one
  async function adminSurveys(body) {
    const mine = ++surveyRun;
    const o = await authed("admin_surveys", { key }); if (!o) { body.textContent = "Not available."; return; }
    body.innerHTML = "";
    const field = (ph, width, type) => { const i = document.createElement("input"); i.placeholder = ph; if (type) i.type = type; i.style.cssText = `font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;width:${width}px;background:var(--box);color:var(--fg)`; return i; };
    const pick = (label, list) => { const sel = document.createElement("select"); sel.style.cssText = "font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--box);color:var(--fg);max-width:260px"; sel.append(new Option(label, "")); for (const x of list) sel.append(new Option(x, x)); return sel; };
    const row = () => { const d = el("div"); d.style.cssText = "display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap"; return d; };
    const note = el("p"); note.style.cssText = "font-size:13px;margin:0 0 10px;color:var(--muted, #667)";
    body.append(el("p", null, "One question asked of every company in a scope: a small reading a company, a table with the source of each row. \"No page found\" and \"not stated in the pages read\" are never counted as a no."));
    // the question and its scope
    const q = field("the question, e.g. Does the company tie executive pay to greenhouse gas emissions?", 620);
    const ind = pick("any industry", industries), reg = pick("any region", regions), cty = field("country, ISO code", 130), y0 = field("from year", 90, "number"), y1 = field("to year", 90, "number");
    q.onchange = () => { try { const p = parse(q.value); if (p.industry && !ind.value) ind.value = p.industry; if (p.region && !reg.value) reg.value = p.region; if (p.country && !cty.value) cty.value = p.country; if (p.from && !y0.value) y0.value = p.from; if (p.to && !y1.value) y1.value = p.to; } catch (e) {} };
    const r1 = row(), r2 = row(), out = el("div");
    r1.append(q); r2.append(ind, reg, cty, y0, y1);
    const show = g => {
      out.innerHTML = "";
      if (!g) { out.textContent = "That survey is not available."; return; }
      const c = g.counts, scope = [g.industry, g.region, g.country, g.year_from || g.year_to ? `${g.year_from || ""}–${g.year_to || ""}` : ""].filter(Boolean).join(" · ") || "no filter: the companies a search for the words found";
      out.append(el("h3", null, g.question));
      const line = el("p", null, `${scope}. Searched with “${g.words}”, ${g.pages} pages a company` + (g.in_scope > c.companies ? `; the scope holds ${g.in_scope} companies and the ceiling kept ${c.companies}` : "") + `. So far about ${Number(c.usd).toFixed(3)} USD.`); line.style.cssText = "font-size:13px;color:var(--muted, #667);margin:0 0 6px";
      const sum = el("p", null, surveyCounts(c)); sum.style.cssText = "font-weight:600;margin:0 0 8px";
      const file = adminBtn("Download as CSV", () => saveText(surveyFile(g), surveyCsv(g))); file.title = "Every row of this survey, as it stands now, for Excel";
      sum.append(document.createTextNode("  "), file);
      out.append(line, sum);
      if (c.right || c.wrong) sum.append(document.createTextNode(`  Checked against the page: ${c.right} right, ${c.wrong} wrong.`));
      out.appendChild(adminTable(["Company", "Answer", "In short", "Year", "The sentence", "Source", "Check"], g.rows.map(x => {
        const src = el("span");
        if (x.library_id && x.page) { const a = el("a", null, `${x.doc_year || ""} ${x.doc_type || "document"}, page ${x.page}`.trim()); a.href = "#"; a.title = "The page's text, inside lanterN"; a.onclick = ev => { ev.preventDefault(); openReader(x.library_id, x.page, x.evidence || ""); }; src.append(a); }
        else if (x.status === "yes" || x.status === "no") { src.textContent = "page not named by the reader"; src.style.color = "var(--muted, #667)"; }
        return [x.company, SURVEY_WORDS[x.status] || x.status, x.value || "", x.year || "", x.evidence || "", src, x.status === "yes" || x.status === "no" ? surveyMarks(g, x, () => show(g)) : ""];
      })));
    };
    const run = async id => {
      const me = ++surveyRun;
      for (;;) {
        const g = await authed("survey_step", { key, survey: id, companies: 3 });
        if (me !== surveyRun || !document.body.contains(out)) return;          // another run started, or the section was left
        if (!g) { note.textContent = "The survey stopped: no answer from the database. \"Open\" continues it."; return; }
        show(g);
        if (g.off || g.limit) { note.textContent = g.limit ? "Today's ceiling of readings is reached; it continues tomorrow with \"Open\"." : `Not run: ${g.why || "the reader is not set up"}.`; return; }
        if (g.status === "done") { note.textContent = "Done."; return; }
        note.textContent = `Reading… ${g.counts.pending} companies to go. Leaving this section stops it; \"Open\" continues it.`;
      }
    };
    const start = adminBtn("Start", async () => {
      const text = q.value.trim(); if (text.length < 8) { note.textContent = "A question of at least 8 characters."; return; }
      note.textContent = "Fixing the scope…"; out.innerHTML = "";
      let vec = null; try { vec = await queryVector(text); } catch (e) { vec = null; }
      const g = await authed("survey_start", { key, question: text, qvec: vec, industry_filter: ind.value || null, country_filter: cty.value.trim().toUpperCase() || null, region_filter: reg.value || null,
                                               year_from: parseInt(y0.value, 10) || null, year_to: parseInt(y1.value, 10) || null, client: CLIENT });
      if (!g) { note.textContent = "Not started."; return; }
      if (g.off) { note.textContent = (g.why || "Surveys are off for this address.") + " Give the address a number of surveys a day below."; return; }
      if (g.limit) { note.textContent = `Today's ${g.per_day} surveys for this address are used.`; return; }
      if (!g.companies) { note.textContent = "No company in that scope."; return; }
      note.textContent = "";
      const ask = row();
      ask.append(el("span", null, `${g.companies} companies` + (g.in_scope > g.companies ? ` (the scope holds ${g.in_scope}; the ceiling is ${g.companies})` : "") + `, ${g.pages} pages each, searched with “${g.words}”: about ${Number(g.usd).toFixed(2)} USD.`),
                 adminBtn("Run it", () => { ask.remove(); run(g.id); }), adminBtn("Not now", () => { ask.remove(); note.textContent = "Kept, not run. \"Open\" below runs it later."; adminSurveys(body); }));
      out.append(ask);
    });
    r1.append(start);
    body.append(r1, r2, note, out);
    if (mine !== surveyRun) return;
    // past surveys
    if (o.surveys.length) {
      body.append(el("h3", null, "Surveys run"));
      body.appendChild(adminTable(["When", "Who", "Question", "Companies", "Yes", "USD", "State", ""], o.surveys.map(x => [adminWhen(x.at), x.asker, x.question, x.companies, x.yes, Number(x.usd).toFixed(3), x.status === "done" ? "done" : "not finished",
        adminBtn(x.status === "done" ? "Open" : "Open and continue", async () => { const g = await authed("survey_get", { key, survey: x.id }); show(g); out.scrollIntoView({ behavior: "smooth", block: "start" }); if (g && g.status !== "done") run(x.id); })])));
    }
    // who may, and the settings
    body.append(el("h3", null, "Who may run surveys"));
    const setNote = el("span"); setNote.style.cssText = "font-size:13px;margin-left:8px";
    const save = async args => { const r = await authed("admin_surveys", Object.assign({ key }, args)); if (!r || r.error) { setNote.textContent = (r && r.error) || "Not saved."; return; } await adminSurveys(body); };
    if (o.people.length) body.appendChild(adminTable(["Person", "Surveys today", "A day", ""], o.people.map(p => { const i = field("", 60, "number"); i.value = p.per_day; return [p.email, p.today, i, adminBtn("Save", () => save({ email: p.email, per_day: parseInt(i.value, 10) }))]; })));
    else body.append(el("p", null, "Nobody yet: surveys are off for every address until one is given a number here."));
    const who = field("address", 280), per = field("a day", 70, "number"); per.value = 3;
    const r3 = row(); r3.append(who, per, adminBtn("Allow", () => save({ email: who.value.trim(), per_day: parseInt(per.value, 10) })), setNote);
    body.append(r3);
    body.append(el("h3", null, "Settings"));
    const pg = field("", 60, "number"), mx = field("", 80, "number"), rd = field("", 90, "number"); pg.value = o.settings.pages; mx.value = o.settings.max_companies; rd.value = o.settings.readings;
    const lab = t => { const sp = el("span", null, t); sp.style.fontSize = "13px"; return sp; };
    const r4 = row(); r4.append(lab("Pages read a company"), pg, lab("Companies a survey, at most"), mx, lab("Readings a day, everyone together"), rd,
                               adminBtn("Save settings", () => save({ pages: parseInt(pg.value, 10), max_companies: parseInt(mx.value, 10), readings: parseInt(rd.value, 10) })));
    body.append(r4);
    const today = el("p", null, `Read today: ${o.read_today} companies. A reading of ${o.settings.pages} pages costs about ${((o.settings.pages * 750 * 0.10 + 800 * 0.50) / 10000).toFixed(2)} US cents.`); today.style.cssText = "font-size:13px;color:var(--muted, #667)";
    body.append(today);
  }
  async function adminCost(body) {
    const o = await authed("admin_overview", { key }); if (!o) { body.textContent = "Not available."; return; }
    body.innerHTML = "";
    const total = o.days.reduce((a, d) => a + Number(d.usd), 0), answers = o.days.reduce((a, d) => a + Number(d.answers), 0);
    body.append(el("p", null, `Last 30 days: ${answers} answers, about ${total.toFixed(2)} USD` + (answers ? ` (${(100 * total / answers).toFixed(2)} cents an answer, ${(20 * total / answers).toFixed(2)} USD for twenty)` : "") + `. At the reader model's list price: 0.10 USD a million tokens read, 0.50 written. Facts kept from answers: ${o.facts.all} (${o.facts.right} marked right, ${o.facts.wrong} wrong).`));
    body.appendChild(adminTable(["Day (UTC)", "Questions", "Answered", "People", "Tokens read", "Tokens written", "USD"], o.days.map(d => [d.day, d.asked, d.answers, d.people, Number(d.tokens_in).toLocaleString("en-GB"), Number(d.tokens_out).toLocaleString("en-GB"), Number(d.usd).toFixed(3)])));
  }
  adminLink();
  loadCompanies().then(() => {
    const q0 = new URLSearchParams(location.search).get("q");
    // as=search (the owner's panel, v79): run the words as a search even when they read like a question, so that
    // looking at what someone asked never launches (and spends) an answer
    if (q0) { $("q").value = q0; new URLSearchParams(location.search).get("as") === "search" ? (closeHistory(), search(false)) : go(); }
  });
})();
</script>
</body>
</html>
