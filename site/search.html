<style>
  /* Brand colours: --brand (dark), --accent (buttons, links), --flame (the lantern's light). Swap these three for
     WBA's own hex codes; everything else follows. */
  /* WBA brand (branding guide, theme colours): navy 00194B, blue 2378FF and 1E64CC, yellow FAC300, green 4BB42D,
     red FF3C23, teal 0FC8BE. The lantern's light is the brand yellow; buttons and links the deeper blue (contrast). */
  :root {

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
      --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
    --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 28px; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap > :not(footer) { flex: none; }
  header { display: flex; align-items: center; padding: 24px 0 6px; }
  header.home { justify-content: center; padding-top: 16vh; }
  .brand { display: block; line-height: 0; }
  .brand svg { width: 232px; height: 50px; display: block; }
  header.home .brand svg { width: 460px; max-width: 92vw; height: auto; }
  .brand .lamp { fill: var(--brand); } .brand .glass { fill: var(--bg); } .brand .flame { fill: var(--flame); }
  .brand .l1 { fill: var(--brand); } .brand .l7 { fill: #1E64CC; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .lamp, :root:not([data-theme="light"]) .brand .l1 { fill: #ECEFF4; }
                                        :root:not([data-theme="light"]) .brand .l7, :root:not([data-theme="light"]) .brand .l2 { fill: #6FA8FF; } }
  :root[data-theme="dark"] .brand .lamp, :root[data-theme="dark"] .brand .l1 { fill: #ECEFF4; }
  :root[data-theme="dark"] .brand .l7, :root[data-theme="dark"] .brand .l2 { fill: #6FA8FF; }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
  footer a:hover { color: var(--accent); }
  form.box { display: flex; gap: 0; width: 100%; margin: 14px 0 6px; align-items: stretch; }
  header.home + form.box { max-width: 640px; margin: 26px auto 10px; }
  .box .funnel { flex: none; margin-left: 10px; width: 44px; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 22px;
                 cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .box .funnel:hover, .box .funnel[aria-expanded="true"] { color: var(--accent); border-color: var(--line); background: var(--box); }
  .box .funnel svg { width: 20px; height: 20px; }
  .boxwrap { position: relative; width: 100%; }
  header.home ~ .boxwrap { max-width: 640px; margin: 26px auto 10px; }
  header.home ~ .boxwrap form.box { margin: 0; }
  .history { position: absolute; left: 0; right: 54px; top: calc(100% + 6px); background: var(--box); border: 1px solid var(--line); border-radius: 16px;
             box-shadow: 0 10px 30px rgba(0, 25, 75, .12); z-index: 5; padding: 6px 0; display: none; }
  .history.open { display: block; }
  .history .h { display: flex; align-items: center; gap: 10px; padding: 7px 14px; cursor: pointer; font-size: 15px; }
  .history .h:hover, .history .h.on { background: var(--chip); }
  .history .h svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .history .h span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history .h small { color: var(--muted); font-size: 12px; }
  .history .h button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 2px; visibility: hidden; }
  .history .h:hover button { visibility: visible; }
  .history .foot { display: flex; justify-content: flex-end; padding: 4px 14px 2px; font-size: 12px; color: var(--muted); }
  .history .foot button { border: 0; background: none; color: inherit; cursor: pointer; font: inherit; text-decoration: underline; }
  .box input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px 16px; border: 1px solid var(--line);

  .box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .box button { font: inherit; font-weight: 500; padding: 0 20px; border: 1px solid var(--accent); background: var(--accent);
                color: #fff; border-radius: 0 24px 24px 0; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; min-height: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--chip); border: 1px solid var(--line);
          border-radius: 16px; padding: 3px 10px 3px 12px; }
  .chip b { font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .filters { margin: 6px 0 14px; font-size: 14px; color: var(--muted); }

  .filters .row { display: grid; grid-template-columns: 1fr 90px 90px 1fr; gap: 8px; margin-top: 8px; }
  .filters input, .filters select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;

  @media (max-width: 560px) { .filters .row { grid-template-columns: 1fr 1fr; } }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0 10px; min-height: 20px; }
  .values { border: 1px solid var(--line); background: var(--box); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; font-size: 13px; }
  .values[hidden] { display: none; }
  .values summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  .values summary::-webkit-details-marker { display: none; }
  .values summary b { color: var(--fg); font-weight: 500; }
  .values .v { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-top: 1px solid var(--line); margin-top: 8px; }
  .values .v + .v { margin-top: 0; }
  .values .what { color: var(--muted); }
  .values .num { font-size: 16px; font-weight: 600; color: var(--fg); }
  .values .num small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .values .ev { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
  .values .ev a { color: var(--accent); }
  .values .btns { display: flex; gap: 4px; align-items: start; }
  .values .btns button { width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
  .values .btns button:hover { border-color: var(--accent); color: var(--accent); }
  .values .btns .yes.on { background: #4BB42D; border-color: #4BB42D; color: #fff; }
  .values .btns .no.on { background: #FF3C23; border-color: #FF3C23; color: #fff; }
  .values .fix { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 4px; }
  .values .fix input, .values .fix textarea, .values .sign input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); width: 100%; }
  .values .fix .two { display: grid; grid-template-columns: 1fr 80px; gap: 6px; }
  .values .fix button, .values .sign button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; justify-self: start; }
  .values .sign { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; display: grid; gap: 6px; }
  .values .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  @media (min-width: 1180px) {
    .values { position: absolute; top: 96px; left: calc(50% + 396px); width: 310px; margin: 0; max-height: 80vh; overflow: auto; }
    .wrap { position: relative; }
  }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; font-size: 13px; }
  .strip .lbl { color: var(--muted); margin-right: 4px; }
  .strip .co { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--box); color: var(--fg); cursor: pointer; }
  .strip .co:hover { border-color: var(--accent); color: var(--accent); }
  .result { padding: 14px 0; border-top: 1px solid var(--line); }
  .result .doc { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .result .doc .co { color: var(--fg); font-weight: 500; }
  .result h3 { margin: 2px 0 4px; font-size: 18px; font-weight: 500; line-height: 1.3; }
  .result h3 a { text-decoration: none; }
  .result h3 a:hover { text-decoration: underline; }
  .result p { margin: 0; font-size: 15px; color: var(--fg); }
  .result mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .more { display: block; margin: 20px auto 0; font: inherit; padding: 10px 22px; border: 1px solid var(--line); background: var(--box);
          color: var(--fg); border-radius: 20px; cursor: pointer; }
  .notice { background: var(--box); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 24px auto; max-width: 560px; }
  footer { color: var(--muted); font-size: 13px; margin-top: auto; padding-top: 48px; text-align: center; }

  // What the box says beyond words: every company named (longest names first, so "Nike Inc" wins over "Nike"), every
  // year named (one, a span 2022-2024, or several: the earliest to the latest), a document type.
  function parse(text) {
    let q = " " + text.trim().replace(/\s+/g, " ") + " ";
    const found = { company: null, companyName: null, from: null, to: null, type: null, industry: null, country: null, countryName: null, region: null };
    const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const take = (names) => { for (const n of names) { const re = new RegExp("\\s" + esc(n) + "\\s", "i"); if (re.test(q)) { q = q.replace(re, " "); return true; } } return false; };
    // profiles first (an industry name like "Oil & Gas" or a country must not be read as words), longest names first
    for (const ind of [...industries].sort((a, b) => b.length - a.length)) {
      const names = [ind, ind.replace(/ & /g, " and "), ind.replace(/ & /g, " y "), ...(INDUSTRY_ALIASES[ind] || [])];
      if (take(names)) { found.industry = ind; break; }
    }
    for (const [code, names] of Object.entries(COUNTRIES)) { if (take([...names, code])) { found.country = code; found.countryName = names[0]; break; } }
    for (const reg of regions) { if (take([reg, reg.replace(/ & /g, " and "), ...(REGION_ALIASES[reg] || [])])) { found.region = reg; break; } }
    const hits = [];
    const byLength = companies.filter(c => (c.name || "").length >= 4).sort((a, b) => b.name.length - a.name.length);
    for (const c of byLength) {
      const re = new RegExp("\\s" + esc(c.name) + "(?:'s)?\\s", "i");
      if (re.test(q)) { hits.push(c); q = q.replace(re, " "); }
      if (hits.length >= 6) break;
    }
    if (hits.length) { found.company = hits.map(c => c.id).join(";"); found.companyName = hits.map(c => c.name).join(", "); }
    const years = [];
    q = q.replace(/\s(20[0-3]\d)\s*[-–]\s*(20[0-3]\d)(?=\s)/g, (m, a, b) => { years.push(+a, +b); return " "; });
    q = q.replace(/\s(20[0-3]\d)(?=\s)/g, (m, a) => { years.push(+a); return " "; });
    if (years.length) { found.from = Math.min(...years); found.to = Math.max(...years); }
    for (const [w, t] of Object.entries(TYPE_WORDS)) {
      const re = new RegExp("\\s" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s?\\s", "i");
      if (re.test(q)) { found.type = t; found.typeWords = w; q = q.replace(re, " "); break; }
    }
    return { q: q.trim(), ...found };
  }

  // ---- The values the robot has read, and the reviews (10 Nov 2026) ----
  const ATTRS = [
    ["GMC_00001.1", "Scope 1 emissions", ["scope 1", "scope one", "alcance 1"]],
    ["GMC_00002.1", "Scope 2 emissions, location-based", ["scope 2", "scope two", "alcance 2", "location-based", "location based"]],
    ["GMC_00003.1", "Scope 2 emissions, market-based", ["scope 2", "scope two", "alcance 2", "market-based", "market based"]],

    ["GMC_00124.1", "Scope 1 + 2 emissions", ["scope 1 and 2", "scope 1+2", "scope 1 + 2", "scope 1 & 2"]],
    ["GMC_00048.1", "Revenue", ["revenue", "revenues", "turnover", "net sales", "sales", "ingresos"]],

  ];
  const EMISSIONS = ["GMC_00001.1", "GMC_00002.1", "GMC_00003.1", "GMC_00005.1", "GMC_00124.1"];
  const ATTR_NAME = Object.fromEntries(ATTRS.map(a => [a[0], a[1]]));
  function attrsIn(text) {
    const low = " " + text.toLowerCase() + " "; const out = new Set();
    for (const [code, , words] of ATTRS) if (words.some(w => low.includes(w))) out.add(code);
    if (!out.size && /emission|emisiones|ghg|greenhouse|carbon/.test(low)) EMISSIONS.forEach(c => out.add(c));
    return [...out];
  }
  const fmt = v => { const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toLocaleString("en", { maximumFractionDigits: 2 }) + " bn" : a >= 1e6 ? (v / 1e6).toLocaleString("en", { maximumFractionDigits: 2 }) + " m" : v.toLocaleString("en", { maximumFractionDigits: 2 }); };

  // Reviewing needs an author: a code sent to a WBA address, kept in this browser. Searching stays without sign-in.
  const auth = { get() { try { return JSON.parse(localStorage.getItem("find_session") || "null"); } catch (e) { return null; } },
                 set(v) { try { v ? localStorage.setItem("find_session", JSON.stringify(v)) : localStorage.removeItem("find_session"); } catch (e) {} } };
  async function authCall(path, body) {
    const r = await fetch(`${CONFIG.url}/auth/v1/${path}`, { method: "POST", headers: { apikey: CONFIG.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.msg || j.error_description || j.message || `${r.status}`);
    return j;
  }
  async function token() {
    let s = auth.get(); if (!s) return null;
    if (s.expires_at && s.expires_at * 1000 < Date.now() + 60000) {
      try { const j = await authCall("token?grant_type=refresh_token", { refresh_token: s.refresh_token }); s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at, email: j.user && j.user.email }; auth.set(s); }
      catch (e) { auth.set(null); return null; }
    }
    return s.access_token;
  }
  async function review(body) {
    const t = await token(); if (!t) throw new Error("sign in");
    const r = await fetch(`${CONFIG.url}/rest/v1/rpc/review_value`, { method: "POST", headers: { apikey: CONFIG.key, Authorization: `Bearer ${t}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || `${r.status}`);
    return j;
  }
  function signInBox(panel, then) {
    let box = panel.querySelector(".sign"); if (box) box.remove();
    box = el("div", "sign");
    const msg = el("div", "what", "To review, enter your WBA email; a code arrives by mail. Once per browser.");
    const mail = el("input"); mail.type = "email"; mail.placeholder = "name@worldbenchmarkingalliance.org";
    const send = el("button", null, "Send me the code");
    const code = el("input"); code.placeholder = "Code from the email"; code.inputMode = "numeric"; code.style.display = "none";
    const ok = el("button", null, "Sign in"); ok.style.display = "none";
    send.onclick = async () => { try { send.disabled = true; await authCall("otp", { email: mail.value.trim(), create_user: true }); msg.textContent = "Code sent. Type it here."; code.style.display = ok.style.display = ""; code.focus(); } catch (e) { msg.textContent = `Could not send the code: ${e.message}`; } finally { send.disabled = false; } };
    ok.onclick = async () => { try { const j = await authCall("verify", { type: "email", email: mail.value.trim(), token: code.value.trim() }); auth.set({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at, email: mail.value.trim() }); box.remove(); then(); } catch (e) { msg.textContent = `That code did not work: ${e.message}`; } };
    box.append(msg, mail, send, code, ok); panel.appendChild(box); mail.focus();
  }
  async function loadValues() {
    const panel = $("values"); panel.hidden = true; panel.innerHTML = "";
    if (!state.company) return;
    const attrs = attrsIn($("q").value);
    let vals;
    try { vals = await rpc("find_values", { key, company_filter: state.company, year_from: state.from, year_to: state.to, attribute_filter: attrs.length ? attrs.join(";") : null }); }
    catch (e) { return; }                                    // the panel is an extra: a failure never touches the search
    if (!vals || !vals.length) return;
    const shownAt = Date.now();
    const sum = el("summary"); sum.innerHTML = `<b>Values we hold</b> · ${vals.length} · read by the robot, yours to confirm`; panel.appendChild(sum);
    for (const v of vals.slice(0, 40)) {
      const row = el("div", "v");
      const left = el("div");
      left.append(el("div", "what", `${v.company} · ${ATTR_NAME[v.attribute] || v.attribute} · ${v.year}`));
      const num = el("div", "num", fmt(v.value) + " "); num.append(el("small", null, [v.unit, v.basis].filter(Boolean).join(", "))); left.appendChild(num);
      const btns = el("div", "btns"); const yes = el("button", "yes", "✓"); yes.title = "This value is right"; const no = el("button", "no", "✗"); no.title = "This value is wrong";
      btns.append(yes, no);
      const ev = el("div", "ev");
      const evidence = v.readings > 1 ? `${v.agree} of ${v.readings} documents read give this figure` + (v.variants > 1 ? `, ${v.variants} different figures in all` : "") : "read in one document";
      ev.append(document.createTextNode(evidence + " · "));
      if (v.url) { const a = el("a", null, `source, page ${v.page || "?"}`); a.href = /\.pdf(\?|$)/i.test(v.url) || !/#/.test(v.url) ? `${v.url}#page=${v.page || 1}` : v.url; a.target = "_blank"; a.rel = "noopener"; ev.appendChild(a); }
      if (v.ok || v.wrong) ev.append(document.createTextNode(` · reviews: ${v.ok} ✓ ${v.wrong} ✗`));
      const send = async (verdict, extra) => {
        const body = Object.assign({ version_id: v.version_id, verdict, seconds: Math.round((Date.now() - shownAt) / 1000), log_id: state.logId, client: CLIENT }, extra || {});
        try { await review(body); yes.classList.toggle("on", verdict === "ok"); no.classList.toggle("on", verdict === "wrong"); const f = row.querySelector(".fix"); if (f && verdict === "ok") f.remove(); return true; }
        catch (e) { if (/sign in|JWT|401|42501/.test(e.message)) { signInBox(panel, () => send(verdict, extra)); } else { ev.append(document.createTextNode(` · not saved: ${e.message}`)); } return false; }
      };
      yes.onclick = () => send("ok");
      no.onclick = () => {
        if (row.querySelector(".fix")) return;
        const f = el("div", "fix");
        const right = el("input"); right.placeholder = "The right value, if you know it (optional)";
        const two = el("div", "two"); const link = el("input"); link.placeholder = "Link to the document that has it (optional)"; const pg = el("input"); pg.placeholder = "Page"; pg.inputMode = "numeric"; two.append(link, pg);
        const why = el("textarea"); why.rows = 2; why.placeholder = "Why, in a line (optional)";
        const go = el("button", null, "Send correction");
        go.onclick = async () => { if (await send("wrong", { correct_value: right.value, source_url: link.value, source_page: parseInt(pg.value, 10) || null, comment: why.value })) { f.innerHTML = ""; f.append(el("div", "what", "Thank you. The team reviews corrections before anything changes.")); } };
        const cancel = el("button", null, "Cancel"); cancel.type = "button"; cancel.style.cssText = "background:none;color:var(--muted);border-color:var(--line)"; cancel.onclick = () => f.remove();
        const acts = el("div"); acts.style.cssText = "display:flex;gap:8px"; acts.append(go, cancel);
        f.append(right, two, why, acts); row.appendChild(f); right.focus();
      };
      row.append(left, btns, ev); panel.appendChild(row);
    }
    panel.append(el("div", "note", "Agreement between documents says a figure is printed more than once, not that it is the right one."));
    panel.hidden = false; panel.open = window.matchMedia("(min-width: 1180px)").matches || vals.length <= 3;
  }

  function companyId(name) { const c = companies.find(x => (x.name || "").toLowerCase() === name.toLowerCase()); return c ? c.id : name; }

  // Your recent searches, in this browser only (the link's key is shared, so the database cannot tell people apart).
  const HIST = "find_history", HIST_MAX = 30;
  const history_ = { load() { try { return JSON.parse(localStorage.getItem(HIST) || "[]"); } catch (e) { return []; } },

  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "now" : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };

  }
  function closeHistory() { $("history").classList.remove("open"); }
  $("q").addEventListener("focus", renderHistory);
  $("q").addEventListener("input", renderHistory);
  $("q").addEventListener("blur", () => setTimeout(closeHistory, 120));
  $("q").addEventListener("keydown", e => { if (e.key === "Escape") closeHistory(); });
  $("form").addEventListener("submit", e => { e.preventDefault(); closeHistory(); search(false); });
  $("funnel").addEventListener("click", () => { const f = $("filters"); f.hidden = !f.hidden; $("funnel").setAttribute("aria-expanded", String(!f.hidden)); if (!f.hidden) $("fCompany").focus(); });
  for (const id of ["fCompany", "fFrom", "fTo", "fType"]) $(id).addEventListener("change", () => { if ($("q").value.trim()) search(false); });
  $("foot").innerHTML = 'Every page of every report WBA holds, in any language · Powered by <a href="https://www.worldbenchmarkingalliance.org/" target="_blank" rel="noopener">World Benchmarking Alliance</a> · Searches and the pages opened are logged, without names, to improve the ranking.';
  loadCompanies().then(() => {
    const q0 = new URLSearchParams(location.search).get("q");
    if (q0) { $("q").value = q0; search(false); }
  });
})();
</script>
</body>
</html>
