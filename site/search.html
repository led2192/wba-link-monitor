<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>lanterN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 2 40 58'%3E%3Crect x='19' y='4' width='26' height='6' rx='3' fill='%2300194B'/%3E%3Cpath d='M16 13h32l-4 38H20z' fill='%2300194B'/%3E%3Cpath d='M17.3 15.5h29.5l0.31 2.9H17.6z' fill='%23FF3C23'/%3E%3Cpath d='M17.6 18.9h28.8l0.31 2.9H17.9z' fill='%23FAC300'/%3E%3Cpath d='M18.0 22.3h28.0l0.31 2.9H18.3z' fill='%234BB42D'/%3E%3Cpath d='M18.3 25.7h27.3l0.31 2.9H18.6z' fill='%232378FF'/%3E%3Cpath d='M18.7 29.1h26.6l0.31 2.9H19.0z' fill='%230FC8BE'/%3E%3Cpath d='M19.1 32.5h25.9l0.31 2.9H19.4z' fill='%23FF3C23'/%3E%3Cpath d='M19.4 35.9h25.2l0.31 2.9H19.7z' fill='%23FAC300'/%3E%3Cpath d='M19.8 39.3h24.5l0.31 2.9H20.1z' fill='%234BB42D'/%3E%3Cpath d='M20.1 42.7h23.7l0.31 2.9H20.4z' fill='%232378FF'/%3E%3Cpath d='M20.5 46.1h23.0l0.31 2.9H20.8z' fill='%230FC8BE'/%3E%3Cpath d='M20.8 49.5h22.3l0.31 2.9H21.1z' fill='%23FF3C23'/%3E%3Crect x='26' y='19' width='12' height='20' rx='2' fill='%23FBFBF8'/%3E%3Crect x='29' y='24' width='6' height='2' fill='%23FAC300'/%3E%3Crect x='29' y='29' width='6' height='2' fill='%23FAC300'/%3E%3Crect x='14' y='52' width='36' height='6' rx='3' fill='%2300194B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Brand colours: --brand (dark), --accent (buttons, links), --flame (the lantern's light). Swap these three for
     WBA's own hex codes; everything else follows. */
  /* WBA brand (branding guide, theme colours): navy 00194B, blue 2378FF and 1E64CC, yellow FAC300, green 4BB42D,
     red FF3C23, teal 0FC8BE. The lantern's light is the brand yellow; buttons and links the deeper blue (contrast). */
  :root {
    --brand: #00194B; --accent: #1E64CC; --flame: #FAC300; --blue: #2378FF;
    --bg: #FBFBF8; --fg: var(--brand); --muted: #4F5B70; --line: #E1E5EC; --box: #FFFFFF;
    --accent-2: var(--flame); --mark: #FFF3B8; --chip: #EDF2FA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
      --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1630; --fg: #ECEFF4; --muted: #A4ADBB; --line: #24324F; --box: #132042;
    --accent: #6FA8FF; --accent-2: #FAC300; --mark: #4A3F12; --chip: #1C2A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 28px; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap > :not(footer) { flex: none; }
  header { display: flex; align-items: center; padding: 24px 0 6px; }
  header.home { justify-content: center; padding-top: 16vh; }
  .brand { display: block; line-height: 0; }
  .brand svg { width: 232px; height: 50px; display: block; }
  header.home .brand svg { width: 460px; max-width: 92vw; height: auto; }
  .brand .lamp { fill: var(--brand); } .brand .glass { fill: var(--bg); } .brand .flame { fill: var(--flame); }
  .brand .l1 { fill: var(--brand); } .brand .l7 { fill: #1E64CC; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .lamp, :root:not([data-theme="light"]) .brand .l1 { fill: #ECEFF4; }
                                        :root:not([data-theme="light"]) .brand .l7, :root:not([data-theme="light"]) .brand .l2 { fill: #6FA8FF; } }
  :root[data-theme="dark"] .brand .lamp, :root[data-theme="dark"] .brand .l1 { fill: #ECEFF4; }
  :root[data-theme="dark"] .brand .l7, :root[data-theme="dark"] .brand .l2 { fill: #6FA8FF; }
  footer a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
  footer a:hover { color: var(--accent); }
  form.box { display: flex; gap: 0; width: 100%; margin: 14px 0 6px; align-items: stretch; }
  header.home + form.box { max-width: 640px; margin: 26px auto 10px; }
  .box .funnel { flex: none; margin-left: 10px; width: 44px; border: 1px solid transparent; background: none; color: var(--muted); border-radius: 22px;
                 cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .box .funnel:hover, .box .funnel[aria-expanded="true"] { color: var(--accent); border-color: var(--line); background: var(--box); }
  .box .funnel svg { width: 20px; height: 20px; }
  .boxwrap { position: relative; width: 100%; }
  header.home ~ .boxwrap { max-width: 640px; margin: 26px auto 10px; }
  header.home ~ .boxwrap form.box { margin: 0; }
  .history { position: absolute; left: 0; right: 54px; top: calc(100% + 6px); background: var(--box); border: 1px solid var(--line); border-radius: 16px;
             box-shadow: 0 10px 30px rgba(0, 25, 75, .12); z-index: 5; padding: 6px 0; display: none; }
  .history.open { display: block; }
  .history .h { display: flex; align-items: center; gap: 10px; padding: 7px 14px; cursor: pointer; font-size: 15px; }
  .history .h:hover, .history .h.on { background: var(--chip); }
  .history .h svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .history .h span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history .h small { color: var(--muted); font-size: 12px; }
  .history .h button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 2px; visibility: hidden; }
  .history .h:hover button { visibility: visible; }
  .history .foot { display: flex; justify-content: flex-end; padding: 4px 14px 2px; font-size: 12px; color: var(--muted); }
  .history .foot button { border: 0; background: none; color: inherit; cursor: pointer; font: inherit; text-decoration: underline; }
  .box input { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 12px 16px; border: 1px solid var(--line);
               border-right: 0; border-radius: 24px 0 0 24px; background: var(--box); color: var(--fg); outline: none; }
  .box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
  .box button { font: inherit; font-weight: 500; padding: 0 20px; border: 1px solid var(--accent); background: var(--accent);
                color: #fff; border-radius: 0 24px 24px 0; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; min-height: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; background: var(--chip); border: 1px solid var(--line);
          border-radius: 16px; padding: 3px 10px 3px 12px; }
  .chip b { font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .filters { margin: 6px 0 14px; font-size: 14px; color: var(--muted); }
  .filters[hidden] { display: none; }
  header.home ~ .filters { max-width: 640px; margin-left: auto; margin-right: auto; }
  .filters .row { display: grid; grid-template-columns: 1fr 90px 90px 1fr; gap: 8px; margin-top: 8px; }
  .filters input, .filters select { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
                                    background: var(--box); color: var(--fg); min-width: 0; }
  @media (max-width: 560px) { .filters .row { grid-template-columns: 1fr 1fr; } }
  .status { color: var(--muted); font-size: 14px; margin: 6px 0 14px; min-height: 20px; }
  .result { padding: 14px 0; border-top: 1px solid var(--line); }
  .result .doc { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .result .doc .co { color: var(--fg); font-weight: 500; }
  .result h3 { margin: 2px 0 4px; font-size: 18px; font-weight: 500; line-height: 1.3; }
  .result h3 a { text-decoration: none; }
  .result h3 a:hover { text-decoration: underline; }
  .result p { margin: 0; font-size: 15px; color: var(--fg); }
  .result mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .more { display: block; margin: 20px auto 0; font: inherit; padding: 10px 22px; border: 1px solid var(--line); background: var(--box);
          color: var(--fg); border-radius: 20px; cursor: pointer; }
  .notice { background: var(--box); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 24px auto; max-width: 560px; }
  footer { color: var(--muted); font-size: 13px; margin-top: auto; padding-top: 48px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header id="head" class="home">
    <a class="brand" href="search.html" aria-label="Lantern, home">
      <svg viewBox="0 0 300 64" aria-hidden="true">
        <defs><linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FAC300" stop-opacity=".22"/><stop offset="1" stop-color="#FAC300" stop-opacity="0"/></linearGradient></defs>
        <path d="M44 27 L262 10 L262 54 L44 39 Z" fill="url(#beam)"/>
        <rect class="lamp" x="19" y="4" width="26" height="6" rx="3"/>
        <path class="lamp" d="M16 13h32l-4 38H20z"/>
        <path d="M17.3 15.5h29.5l0.31 2.9H17.6z" fill="#FF3C23"/><path d="M17.6 18.9h28.8l0.31 2.9H17.9z" fill="#FAC300"/><path d="M18.0 22.3h28.0l0.31 2.9H18.3z" fill="#4BB42D"/><path d="M18.3 25.7h27.3l0.31 2.9H18.6z" fill="#2378FF"/><path d="M18.7 29.1h26.6l0.31 2.9H19.0z" fill="#0FC8BE"/><path d="M19.1 32.5h25.9l0.31 2.9H19.4z" fill="#FF3C23"/><path d="M19.4 35.9h25.2l0.31 2.9H19.7z" fill="#FAC300"/><path d="M19.8 39.3h24.5l0.31 2.9H20.1z" fill="#4BB42D"/><path d="M20.1 42.7h23.7l0.31 2.9H20.4z" fill="#2378FF"/><path d="M20.5 46.1h23.0l0.31 2.9H20.8z" fill="#0FC8BE"/><path d="M20.8 49.5h22.3l0.31 2.9H21.1z" fill="#FF3C23"/>
        <rect class="glass" x="26" y="19" width="12" height="20" rx="2"/><rect class="flame" x="29" y="24" width="6" height="2"/><rect class="flame" x="29" y="29" width="6" height="2"/>
        <rect class="lamp" x="14" y="52" width="36" height="6" rx="3"/>
        <text x="70" y="47" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="600" letter-spacing="-0.8"><tspan class="l1">l</tspan><tspan class="l2" fill="#2378FF">a</tspan><tspan fill="#0FC8BE">n</tspan><tspan fill="#4BB42D">t</tspan><tspan fill="#FAC300">e</tspan><tspan fill="#FF3C23">r</tspan><tspan class="l7">N</tspan></text>
      </svg>
    </a>
  </header>
  <div class="boxwrap" id="boxwrap">
  <form class="box" id="form" autocomplete="off">
    <input id="q" type="search" placeholder="Unilever scope 1 2024, or placeholder="Type it as you would in a web search: Unilever scope 1 2024, or &quot;living wage&quot;"quot;living wageplaceholder="Type it as you would in a web search: Unilever scope 1 2024, or &quot;living wage&quot;"quot;" aria-label="Search" autofocus>
    <button type="submit">Search</button>
    <button type="button" class="funnel" id="funnel" aria-expanded="false" aria-controls="filters" title="Filters: company, years, document type">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg>
    </button>
  </form>
  <div class="history" id="history" role="listbox" aria-label="Your recent searches"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="filters" id="filters" hidden>
    <div class="row">
      <input id="fCompany" list="companies" placeholder="Company">
      <datalist id="companies"></datalist>
      <input id="fFrom" type="number" min="2000" max="2030" placeholder="From year">
      <input id="fTo" type="number" min="2000" max="2030" placeholder="To year">
      <select id="fType"><option value="">Any document type</option></select>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div id="results"></div>
  <div id="notice"></div>
  <footer id="foot"></footer>
</div>

<script>
(() => {
  const CONFIG = { url: "__SUPABASE_URL__", key: "__SUPABASE_PUBLISHABLE_KEY__" };
  const CLIENT = "lantern v2 2026-11-10";
  const TYPES = ["Annual Report", "Integrated Report", "Sustainability Report", "ESG Report", "CSR Report", "Climate Report",
    "Environmental Reports", "Social Reports", "Impact Report", "CDP Report", "GRI", "SASB Index", "Engagement Report",
    "Financial Statement", "10K Form", "Registration Document", "Interim Reports", "Company Presentations", "Statutory Documents",
    "Policy Documents", "Code of Conduct", "Human Rights Policy", "Certifications", "UNKNOWN"];
  const TYPE_WORDS = { "annual report": "Annual Report", "integrated report": "Integrated Report", "sustainability report": "Sustainability Report",
    "esg report": "ESG Report", "csr report": "CSR Report", "climate report": "Climate Report", "10-k": "10K Form", "10k": "10K Form",
    "code of conduct": "Code of Conduct", "policy": "Policy Documents", "presentation": "Company Presentations" };
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // The key travels in the link (#k=...), stays in this browser and never in the address bar afterwards.
  let key = null;
  try {
    const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
    if (m) { localStorage.setItem("find_key", m[1]); history.replaceState(null, "", location.pathname + location.search); }
    key = localStorage.getItem("find_key");
  } catch (e) { key = null; }
  if (!key) {
    $("notice").innerHTML = '<div class="notice"><b>Open the link you were given.</b><br>This page works from a shared link that carries its key; ask the data team for it. Nothing else is needed, no account and no password.</div>';
    $("boxwrap").style.display = "none"; $("filters").hidden = true;
    return;
  }

  let companies = [];
  const state = { q: "", company: null, companyName: null, from: null, to: null, type: null, rows: 50, logId: null };

  async function rpc(fn, body) {
    const r = await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`, {
      method: "POST", headers: { apikey: CONFIG.key, Authorization: `Bearer ${CONFIG.key}`, "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    if (!r.ok) {
      let msg = `${r.status}`;
      try { const j = await r.json(); msg = j.message || j.hint || msg; } catch (e) {}
      if (r.status === 401 || r.status === 403 || /not allowed/.test(msg)) { try { localStorage.removeItem("find_key"); } catch (e) {} }
      throw new Error(msg);
    }
    return r.json();
  }

  async function loadCompanies() {
    try {
      companies = await rpc("find_companies", { key });
      const dl = $("companies"); dl.innerHTML = "";
      for (const c of companies) { const o = document.createElement("option"); o.value = c.name; dl.appendChild(o); }
    } catch (e) { setStatus(`Could not load the company list: ${e.message}`); }
  }
  for (const t of TYPES) { const o = document.createElement("option"); o.value = t; o.textContent = t; $("fType").appendChild(o); }

  // What the box says beyond words: every company named (longest names first, so "Nike Inc" wins over "Nike"), every
  // year named (one, a span 2022-2024, or several: the earliest to the latest), a document type.
  function parse(text) {
    let q = " " + text.trim().replace(/\s+/g, " ") + " ";
    const found = { company: null, companyName: null, from: null, to: null, type: null };
    const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const hits = [];
    const byLength = companies.filter(c => (c.name || "").length >= 4).sort((a, b) => b.name.length - a.name.length);
    for (const c of byLength) {
      const re = new RegExp("\\s" + esc(c.name) + "(?:'s)?\\s", "i");
      if (re.test(q)) { hits.push(c); q = q.replace(re, " "); }
      if (hits.length >= 6) break;
    }
    if (hits.length) { found.company = hits.map(c => c.id).join(";"); found.companyName = hits.map(c => c.name).join(", "); }
    const years = [];
    q = q.replace(/\s(20[0-3]\d)\s*[-–]\s*(20[0-3]\d)(?=\s)/g, (m, a, b) => { years.push(+a, +b); return " "; });
    q = q.replace(/\s(20[0-3]\d)(?=\s)/g, (m, a) => { years.push(+a); return " "; });
    if (years.length) { found.from = Math.min(...years); found.to = Math.max(...years); }
    for (const [w, t] of Object.entries(TYPE_WORDS)) {
      const re = new RegExp("\\s" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "s?\\s", "i");
      if (re.test(q)) { found.type = t; q = q.replace(re, " "); break; }
    }
    return { q: q.trim(), ...found };
  }

  function setStatus(t) { $("status").textContent = t; }

  function renderChips() {
    const box = $("chips"); box.innerHTML = "";
    const add = (label, value, clear) => {
      const c = el("span", "chip"); c.append(el("span", null, label + " "), el("b", null, value));
      const x = el("button", null, "×"); x.title = "Remove this filter"; x.onclick = () => { clear(); search(true); }; c.appendChild(x); box.appendChild(c);
    };
    if (state.company) add(state.company.includes(";") ? "Companies" : "Company", state.companyName || state.company, () => { state.company = state.companyName = null; $("fCompany").value = ""; });
    if (state.from || state.to) add("Years", state.from === state.to ? String(state.from) : `${state.from || ""}–${state.to || ""}`, () => { state.from = state.to = null; $("fFrom").value = $("fTo").value = ""; });
    if (state.type) add("Type", state.type, () => { state.type = null; $("fType").value = ""; });
  }

  function excerptHtml(t) {
    const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    return esc(t || "").replace(/⟦/g, "<mark>").replace(/⟧/g, "</mark>");
  }

  function pageLink(row) {
    const u = row.url || "";
    if (!u) return null;
    return /\.pdf(\?|$)/i.test(u) || !/#/.test(u) ? `${u}#page=${row.page}` : u;
  }

  function render(rows, append) {
    const box = $("results");
    if (!append) box.innerHTML = "";
    for (const r of rows) {
      const d = el("div", "result");
      const doc = el("div", "doc");
      doc.append(el("span", "co", r.company || r.wba_id), el("span", null, r.year ? String(r.year) : "no year"), el("span", null, r.doc_type || "untyped document"), el("span", null, `page ${r.page}`));
      const h = el("h3");
      const href = pageLink(r);
      const a = el("a", null, r.label || r.library_id);
      if (href) { a.href = href; a.target = "_blank"; a.rel = "noopener"; }
      a.addEventListener("click", () => { rpc("find_click", { key, log_id: r.log_id, library_id: r.library_id, page: r.page, rank: r.rank }).catch(() => {}); });
      h.appendChild(a);
      const p = el("p"); p.innerHTML = excerptHtml(r.excerpt);
      d.append(doc, h, p); box.appendChild(d);
    }
    const old = document.querySelector(".more"); if (old) old.remove();
    if (rows.length && state.rows < 200 && rows.length >= state.rows - (append ? 50 : 0)) {
      const m = el("button", "more", "More results"); m.onclick = () => { state.rows += 50; search(true, true); }; box.appendChild(m);
    }
  }

  async function search(fromChips, more) {
    if (!fromChips) {
      const parsed = parse($("q").value);
      state.q = parsed.q;
      state.company = parsed.company || ($("fCompany").value ? companyId($("fCompany").value) : null);
      state.companyName = parsed.companyName || ($("fCompany").value || null);
      state.from = parsed.from || (+$("fFrom").value || null);
      state.to = parsed.to || (+$("fTo").value || null);
      state.type = parsed.type || ($("fType").value || null);
      state.rows = 50;
    } else if (!more) { state.rows = 50; }
    if (!state.q && !more) { setStatus("Type a word or a phrase."); return; }
    $("head").classList.remove("home");
    renderChips();
    setStatus("Searching…");
    const t0 = performance.now();
    try {
      const rows = await rpc("find_pages", { key, q: state.q, company_filter: state.company, year_from: state.from, year_to: state.to,
                                             type_filter: state.type, max_rows: state.rows, client: CLIENT });
      const s = ((performance.now() - t0) / 1000).toFixed(1);
      if (!rows.length) setStatus(`No page holds ${state.q.includes('"') ? "that phrase" : "those words, even one or two of them,"}${state.company || state.type || state.from ? " with these filters" : ""}. (${s} s)`);
      else setStatus(`${rows.length}${rows.length >= state.rows ? "+" : ""} pages, best first, at most three a document. (${s} s)`);
      render(more ? rows.slice(state.rows - 50) : rows, !!more);
      const params = new URLSearchParams(); params.set("q", $("q").value); history.replaceState(null, "", "?" + params.toString());
      if (!more && $("q").value.trim()) history_.add($("q").value.trim());
    } catch (e) {
      setStatus(e.message.includes("not allowed") ? "This link no longer works; ask for a new one." : `Search failed: ${e.message}`);
      $("results").innerHTML = "";
    }
  }
  function companyId(name) { const c = companies.find(x => (x.name || "").toLowerCase() === name.toLowerCase()); return c ? c.id : name; }

  // Your recent searches, in this browser only (the link's key is shared, so the database cannot tell people apart).
  const HIST = "find_history", HIST_MAX = 30;
  const history_ = { load() { try { return JSON.parse(localStorage.getItem(HIST) || "[]"); } catch (e) { return []; } },
                     save(h) { try { localStorage.setItem(HIST, JSON.stringify(h.slice(0, HIST_MAX))); } catch (e) {} },
                     add(q) { const h = this.load().filter(x => x.q !== q); h.unshift({ q, at: Date.now() }); this.save(h); },
                     remove(q) { this.save(this.load().filter(x => x.q !== q)); }, clear() { this.save([]); } };
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "now" : m < 60 ? `${m} min` : m < 1440 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} d`; };
  function renderHistory() {
    const box = $("history"), typed = $("q").value.trim().toLowerCase();
    const items = history_.load().filter(x => !typed || x.q.toLowerCase().includes(typed)).slice(0, 10);
    box.innerHTML = "";
    if (!items.length) { box.classList.remove("open"); return; }
    for (const it of items) {
      const row = el("div", "h"); row.setAttribute("role", "option");
      row.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
      const t = el("span", null, it.q); const when = el("small", null, ago(it.at)); const x = el("button", null, "×"); x.title = "Forget this search";
      x.onclick = ev => { ev.stopPropagation(); history_.remove(it.q); renderHistory(); };
      row.append(t, when, x);
      row.onmousedown = ev => { ev.preventDefault(); $("q").value = it.q; closeHistory(); search(false); };
      box.appendChild(row);
    }
    const f = el("div", "foot"); const c = el("button", null, "Clear my searches"); c.onmousedown = ev => { ev.preventDefault(); history_.clear(); renderHistory(); }; f.appendChild(c); box.appendChild(f);
    box.classList.add("open");
  }
  function closeHistory() { $("history").classList.remove("open"); }
  $("q").addEventListener("focus", renderHistory);
  $("q").addEventListener("input", renderHistory);
  $("q").addEventListener("blur", () => setTimeout(closeHistory, 120));
  $("q").addEventListener("keydown", e => { if (e.key === "Escape") closeHistory(); });
  $("form").addEventListener("submit", e => { e.preventDefault(); closeHistory(); search(false); });
  $("funnel").addEventListener("click", () => { const f = $("filters"); f.hidden = !f.hidden; $("funnel").setAttribute("aria-expanded", String(!f.hidden)); if (!f.hidden) $("fCompany").focus(); });
  for (const id of ["fCompany", "fFrom", "fTo", "fType"]) $(id).addEventListener("change", () => { if ($("q").value.trim()) search(false); });
  $("foot").innerHTML = 'Every page of every report WBA holds, in any language · Powered by <a href="https://www.worldbenchmarkingalliance.org/" target="_blank" rel="noopener">World Benchmarking Alliance</a> · Searches and the pages opened are logged, without names, to improve the ranking.';
  loadCompanies().then(() => {
    const q0 = new URLSearchParams(location.search).get("q");
    if (q0) { $("q").value = q0; search(false); }
  });
})();
</script>
